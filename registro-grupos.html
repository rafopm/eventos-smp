<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registro Grupos - Feria San Martín</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { cream:'#fffeea', cream2:'#fff9c5', yellow:'#ffe846', amber:'#ffba08', brownDeep:'#482000', pink:'#fe1954' } } } }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="config.js?v=13"></script>
<link rel="stylesheet" href="styles.css?v=13">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Fraunces:opsz,wght@9..144,900&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream text-brownDeep p-4 md:p-8">
<main class="w-full max-w-[640px] mx-auto">
  <div class="text-center mb-8">
    <p class="text-[11px] font-black tracking-[0.2em] opacity-30">FERIA • PRESENTACIONES</p>
    <h1 class="font-display font-black text-[clamp(2rem,4vw,3rem)] leading-[0.9] tracking-tight mt-2">Inscribe tu presentación</h1>
    <p class="opacity-50 mt-3 text-[13px] max-w-[420px] mx-auto leading-snug">Proyecto, baile, teatro, canto o banda. Quedará pendiente hasta aprobación del admin.</p>
  </div>
  <section class="card p-6 md:p-8">
    <form id="groupForm" class="grid gap-5">
      <!-- Evento -->
      <div class="card-cream rounded-[16px] p-4">
        <label class="text-[11px] font-black tracking-widest opacity-40">EVENTO *</label>
        <select id="eventId" required class="input mt-2 font-bold">
          <option value="">Cargando eventos...</option>
        </select>
        <div id="eventImagePreview" class="hidden mt-3 flex gap-3 items-center">
          <div class="w-12 h-12 rounded-[12px] overflow-hidden bg-white border border-brownDeep/5"><img id="eventImg" class="w-full h-full object-cover hidden"><span id="eventInitials" class="w-full h-full flex items-center justify-center font-black">SM</span></div>
          <div><p id="eventName" class="font-bold text-[13px]"></p><p id="eventDate" class="text-[11px] opacity-50"></p></div>
        </div>
      </div>
      <div class="grid md:grid-cols-2 gap-4">
        <div><label class="text-[11px] font-bold opacity-50">Categoría *</label><select id="categoryId" required class="input mt-1"><option value="">Primero elige evento...</option></select></div>
        <div><label class="text-[11px] font-bold opacity-50">Tipo *</label>
          <select id="tipoPresentacion" required class="input mt-1">
            <option value="">Selecciona...</option>
            <option value="PROYECTO">🔬 Proyecto</option>
            <option value="BAILE">💃 Baile</option>
            <option value="TEATRO">🎭 Teatro</option>
            <option value="CANTO">🎤 Canto</option>
            <option value="MUSICA">🎸 Banda</option>
            <option value="ARTE">🎨 Arte</option>
            <option value="OTRO">✨ Otro</option>
          </select>
        </div>
      </div>
      <div>
        <label class="text-[11px] font-black tracking-widest">NOMBRE PRESENTACIÓN *</label>
        <div class="relative mt-2">
          <div class="absolute left-0 top-0 bottom-0 w-1 bg-amber rounded-full"></div>
          <input id="title" required placeholder="Ej: Marinera 'Orgullo' / Robot Seguidor" class="input pl-4 border-amber/20 font-bold">
        </div>
      </div>
      <div class="grid md:grid-cols-2 gap-4">
        <div><label class="text-[11px] font-bold opacity-50">Grupo / Elenco</label><input id="nombreGrupo" placeholder="Ej: Danza 4to B" class="input mt-1"></div>
        <div><label class="text-[11px] font-bold opacity-50">Grado / Taller</label><input id="grado" placeholder="4to B" class="input mt-1"></div>
      </div>
      <div><label class="text-[11px] font-bold opacity-50">Integrantes *</label><textarea id="team" required placeholder="Ana Pérez, Luis García..." class="input mt-1" rows="2"></textarea></div>
      <div class="grid md:grid-cols-2 gap-4">
        <div><label class="text-[11px] font-bold opacity-50">Duración</label><input id="duracion" placeholder="5 min" class="input mt-1"></div>
        <div><label class="text-[11px] font-bold opacity-50">Tutor</label><input id="tutorName" placeholder="Docente" class="input mt-1"></div>
      </div>
      <div><label class="text-[11px] font-bold opacity-50">Descripción *</label><textarea id="description" required placeholder="¿De qué trata? Vestuario, mensaje..." class="input mt-1" rows="3"></textarea></div>
      <div class="grid md:grid-cols-2 gap-4">
        <div><label class="text-[11px] font-bold opacity-50">Email responsable *</label><input id="contactEmail" type="email" required placeholder="profesor@..." class="input mt-1"></div>
        <div><label class="text-[11px] font-bold opacity-50">WhatsApp</label><input id="contactPhone" placeholder="999..." class="input mt-1"></div>
      </div>
      <div class="card-cream rounded-[16px] p-4 border-dashed border-2 border-brownDeep/10">
        <label class="text-[11px] font-black tracking-widest">📸 FOTO</label>
        <p class="text-[11px] opacity-40 mt-1">Se sube a Drive: {{DRIVE_FOLDER_ID}}</p>
        <input type="file" id="photoFile" accept="image/*" class="mt-3 w-full text-[12px] file:mr-3 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-brownDeep file:text-white file:font-bold">
        <div id="photoPreview" class="hidden mt-3"><img id="previewImg" class="w-full h-[180px] object-cover rounded-[12px] border"><p id="uploadStatus" class="text-[11px] mt-2 font-mono"></p></div>
        <input id="photoUrlManual" placeholder="O pega URL manual" class="input mt-3 text-[12px]">
      </div>
      <label class="flex gap-2 text-[12px] items-start opacity-60"><input type="checkbox" required class="mt-1"> Acepto quedar pendiente hasta aprobación</label>
      <button id="btnSubmit" class="btn-primary w-full py-4 text-[15px]">📝 Registrar presentación</button>
      <p id="msg" class="hidden text-[12px] p-3 rounded-[12px]"></p>
    </form>
    <div id="successSection" class="hidden text-center py-10">
      <div class="w-14 h-14 bg-amber rounded-full flex items-center justify-center mx-auto text-xl">✓</div>
      <h3 class="font-display font-black text-2xl mt-4">¡Registrado!</h3>
      <p class="opacity-50 text-[13px] mt-2">Pendiente de aprobación</p>
      <p id="successId" class="mt-4 font-mono text-[11px] badge badge-cream"></p>
      <img id="successPhoto" class="hidden mt-5 w-full h-[200px] object-cover rounded-[16px] border">
      <div class="mt-6 grid gap-2"><a href="registro-grupos.html" class="btn-primary">Registrar otro</a><a href="index.html" class="btn-ghost text-center text-sm">Ir a reservas →</a></div>
    </div>
  </section>
  <p class="text-center mt-6"><a href="index.html" class="text-[11px] opacity-30 underline">← Volver a reserva de entradas</a></p>
</main>
<script>
let supabaseClient=null, activeEvent=null, uploadedPhotoUrl=null, events=[];
function initClient(){ supabaseClient = window.initSupabaseClient ? window.initSupabaseClient() : window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY); return supabaseClient; }
async function loadEvents(){
  const sel=document.getElementById('eventId');
  try{
    const {data} = await supabaseClient.from('events').select('*').order('fecha',{ascending:false});
    events=data||[];
    sel.innerHTML='<option value="">Selecciona evento...</option>';
    let activeFound=null;
    data.forEach(ev=>{
      const opt=document.createElement('option'); opt.value=ev.id; opt.textContent=(ev.activo?'● ':'') + ev.nombre + (ev.fecha? ' - '+new Date(ev.fecha).toLocaleDateString():'');
      if(ev.activo) opt.selected=true, activeFound=ev;
      sel.appendChild(opt);
    });
    if(activeFound){ await onEventChange(activeFound.id); }
    else if(data.length>0){ await onEventChange(data[0].id); sel.value=data[0].id; }
  }catch(err){ sel.innerHTML='<option>Error cargando</option>'; }
}
async function onEventChange(eventId){
  const ev = events.find(e=>e.id===eventId); if(!ev) return;
  activeEvent=ev;
  document.getElementById('eventName').textContent=ev.nombre;
  document.getElementById('eventDate').textContent=ev.fecha? new Date(ev.fecha).toLocaleDateString():'';
  document.getElementById('eventImagePreview').classList.remove('hidden');
  const initials = ev.nombre.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
  document.getElementById('eventInitials').textContent=initials;
  const imgUrl = ev.imagen_url || ev.image_url || ev.photo_url;
  const imgEl=document.getElementById('eventImg');
  if(imgUrl){ imgEl.src=imgUrl; imgEl.classList.remove('hidden'); document.getElementById('eventInitials').classList.add('hidden'); }
  else { imgEl.classList.add('hidden'); document.getElementById('eventInitials').classList.remove('hidden'); }
  await loadCategories(eventId);
}
async function loadCategories(eventId){
  const sel=document.getElementById('categoryId'); sel.innerHTML='<option>Cargando...</option>';
  const {data} = await supabaseClient.from('categories').select('*').eq('event_id', eventId).order('orden');
  sel.innerHTML='<option value="">Selecciona categoría...</option>';
  (data||[]).forEach(c=>{ sel.innerHTML+=`<option value="${c.id}">${c.label}</option>`; });
}
document.getElementById('eventId').addEventListener('change', e=>{ if(e.target.value) onEventChange(e.target.value); });
document.getElementById('photoFile').addEventListener('change', async e=>{
  const file=e.target.files[0]; if(!file) return;
  if(file.size>5*1024*1024){ alert('Máx 5MB'); return; }
  const preview=document.getElementById('photoPreview'), previewImg=document.getElementById('previewImg'), status=document.getElementById('uploadStatus');
  preview.classList.remove('hidden'); previewImg.src=URL.createObjectURL(file); status.textContent='📤 Subiendo a Drive...'; status.className='text-[11px] mt-2 badge badge-cream';
  try{
    const base64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
    const driveUrl=window.APPS_SCRIPT_DRIVE_URL || window.APPS_SCRIPT_URL;
    const resp=await fetch(driveUrl,{method:'POST', body: JSON.stringify({fileName:file.name, mimeType:file.type, base64Data:base64, folderId: window.DRIVE_FOLDER_ID||""})});
    const result=await resp.json();
    if(result.success || result.ok || result.url){
      uploadedPhotoUrl=result.url; status.textContent='✅ Subido'; status.className='badge badge-green mt-2'; document.getElementById('photoUrlManual').value=result.url;
    } else throw new Error(result.error||'Error');
  }catch(err){ status.textContent='❌ '+err.message; status.className='badge badge-pink mt-2'; }
});
document.getElementById('groupForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn=document.getElementById('btnSubmit'), msg=document.getElementById('msg');
  btn.disabled=true; btn.textContent='Registrando...'; msg.classList.add('hidden');
  try{
    if(!activeEvent) throw new Error('Elige evento');
    const payload={
      event_id: activeEvent.id,
      category_id: document.getElementById('categoryId').value,
      title: document.getElementById('title').value.trim(),
      team: document.getElementById('team').value.trim(),
      description: document.getElementById('description').value.trim(),
      photo_url: uploadedPhotoUrl || document.getElementById('photoUrlManual').value.trim() || null,
      activo: false,
      contact_email: document.getElementById('contactEmail').value.trim(),
      contact_phone: document.getElementById('contactPhone').value.trim(),
      tutor_name: document.getElementById('tutorName').value.trim(),
      estado_registro: 'PENDIENTE',
      nombre_grupo: document.getElementById('nombreGrupo').value.trim()||null,
      tipo_presentacion: document.getElementById('tipoPresentacion').value,
      grado_seccion: document.getElementById('grado').value.trim(),
      duracion_estimada: document.getElementById('duracion').value.trim()
    };
    const payloadWithDesc={ event_id:payload.event_id, category_id:payload.category_id, title:payload.title, team:payload.team, description:payload.description, photo_url:payload.photo_url, activo:false };
    const fallbackTeam = [payload.nombre_grupo?`Grupo: ${payload.nombre_grupo}`:null, `Integrantes: ${payload.team}`, payload.tipo_presentacion?`Tipo: ${payload.tipo_presentacion}`:null, payload.grado_seccion?`Grado: ${payload.grado_seccion}`:null, payload.description?`Desc: ${payload.description}`:null].filter(Boolean).join(' | ').slice(0,1000);
    const payloadMinimal={ event_id:payload.event_id, category_id:payload.category_id, title:payload.title, team:fallbackTeam, photo_url:payload.photo_url, activo:false };
    let data=null;
    let res = await supabaseClient.from('projects').insert(payload).select().single();
    if(!res.error) data=res.data;
    else if(res.error.message.includes('contact_email') || res.error.message.includes('nombre_grupo')){
      let res2 = await supabaseClient.from('projects').insert(payloadWithDesc).select().single();
      if(!res2.error) data=res2.data;
      else if(res2.error.message.includes('description')){
        let res3 = await supabaseClient.from('projects').insert(payloadMinimal).select().single();
        if(!res3.error) data=res3.data; else throw res3.error;
      } else throw res2.error;
    } else if(res.error.message.includes('description')){
      let res3 = await supabaseClient.from('projects').insert(payloadMinimal).select().single();
      if(!res3.error) data=res3.data; else throw res3.error;
    } else throw res.error;
    document.getElementById('groupForm').classList.add('hidden');
    document.getElementById('successSection').classList.remove('hidden');
    document.getElementById('successId').textContent=data.title+' - PENDIENTE';
    if(payload.photo_url){ const img=document.getElementById('successPhoto'); img.src=payload.photo_url; img.classList.remove('hidden'); }
  }catch(err){
    msg.textContent='Error: '+err.message;
    msg.className='text-[12px] p-3 rounded-[12px] bg-pink/10 border border-pink/20 text-pink';
    msg.classList.remove('hidden');
  } finally{ btn.disabled=false; btn.textContent='📝 Registrar presentación'; }
});
window.addEventListener('load', async()=>{ initClient(); await loadEvents(); });
</script>
</body>
</html>

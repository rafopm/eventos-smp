<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registro - Evento</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
window.SUPABASE_URL = "https://pgnlafozaukhdqlxfcfk.supabase.co";
window.SUPABASE_ANON_KEY = "sb_publishable_pVJiDol9813vN_wCbuRT0w_w1vDatSz";
// PEGA AQUÍ TU URL DE APPS SCRIPT WEB APP
window.APPS_SCRIPT_EMAIL_URL = "https://script.google.com/macros/s/AKfycbyvn-JNmLOvy82o9EW8F5zj1OwDe2cpsJAeoH3joIUN2bsFVtCrBtO0oCKChUx1RO3VXA/exec";
</script>
<script src="config.js?v=4"></script>
</head>
<body class="min-h-screen bg-[#0a0f0d] text-white flex items-center justify-center p-4">
<main class="w-full max-w-md bg-white/[0.05] border border-white/10 rounded-[24px] p-6">
<h1 class="text-2xl font-black">Registro Feria</h1>
<p class="text-white/50 text-sm mt-1">Te enviamos tu QR a eventos@colegiosanmartin.edu.pe</p>

<form id="regForm" class="mt-6 grid gap-3">
<input id="nombres" required placeholder="Nombres" class="rounded-xl bg-white/[0.06] border border-white/10 px-4 py-3 text-sm">
<input id="apellidos" required placeholder="Apellidos" class="rounded-xl bg-white/[0.06] border border-white/10 px-4 py-3 text-sm">
<input id="dni" required placeholder="DNI" class="rounded-xl bg-white/[0.06] border border-white/10 px-4 py-3 text-sm">
<input id="email" type="email" required placeholder="Correo donde recibir QR" class="rounded-xl bg-white/[0.06] border border-white/10 px-4 py-3 text-sm">
<input id="estudiante" placeholder="Nombre estudiante (opcional)" class="rounded-xl bg-white/[0.06] border border-white/10 px-4 py-3 text-sm">
<button id="btnSubmit" class="bg-lime-300 text-black font-extrabold py-3 rounded-xl">Registrar y enviar QR</button>
<p id="msg" class="hidden text-xs p-3 rounded-xl"></p>
</form>

<div id="qrResult" class="hidden mt-6 text-center bg-white text-black p-6 rounded-[20px]">
<p class="font-bold text-sm">¡Registro OK! QR enviado</p>
<div id="qrcode" class="mt-4 flex justify-center"></div>
<p id="qrId" class="mt-3 font-mono text-xs"></p>
<p class="text-[11px] text-black/50 mt-2">Si no te llega el email, muestra este QR en el ingreso + DNI físico</p>
<a id="btnVote" href="vote.html" class="mt-4 inline-block text-xs bg-black text-white px-4 py-2 rounded-full">Ir a votar (cuando ingreses)</a>
</div>
</main>

<script>
let supabaseClient;
function initClient(){
  if(!window.supabase?.createClient){ alert('CDN supabase no cargó'); return null; }
  supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  window.supabaseClient = supabaseClient;
  return supabaseClient;
}

document.getElementById('regForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn=document.getElementById('btnSubmit');
  const msg=document.getElementById('msg');
  btn.disabled=true; btn.textContent='Registrando...';
  msg.classList.remove('hidden'); msg.className='text-xs p-3 rounded-xl bg-white/10'; msg.textContent='Guardando...';
  
  try{
    // 1. Buscar evento activo
    const {data: ev, error: evError} = await supabaseClient.from('events').select('*').eq('activo', true).single();
    if(evError || !ev){ throw new Error('No hay evento activo. Crea uno en admin.html'); }
    
    // 2. Crear registro (id = QR)
    const payload={
      event_id: ev.id,
      nombres: document.getElementById('nombres').value.trim(),
      apellidos: document.getElementById('apellidos').value.trim(),
      dni: document.getElementById('dni').value.trim(),
      email: document.getElementById('email').value.trim().toLowerCase(),
      nombre_estudiante: document.getElementById('estudiante').value.trim()||null,
      estado: 'REGISTRADO'
    };
    
    const {data: reg, error} = await supabaseClient.from('registrations').insert(payload).select().single();
    if(error) throw error;
    
    msg.textContent=`Registro OK: ${reg.id.slice(0,8)} - Enviando email...`;
    
    // 3. Mostrar QR en pantalla inmediatamente (no espera email)
    const qrDiv=document.getElementById('qrResult');
    qrDiv.classList.remove('hidden');
    document.getElementById('qrId').textContent=reg.id;
    document.getElementById('qrcode').innerHTML='';
    new QRCode(document.getElementById('qrcode'), {text: reg.id, width: 200, height: 200});
    
    // 4. Enviar email via Apps Script (en segundo plano, no bloquea)
    if(window.APPS_SCRIPT_EMAIL_URL && window.APPS_SCRIPT_EMAIL_URL.includes('/exec')){
      try{
        await fetch(window.APPS_SCRIPT_EMAIL_URL, {
          method: 'POST',
          mode: 'no-cors', // Apps Script requiere no-cors para evitar preflight
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            to: reg.email,
            id: reg.id,
            nombre: reg.nombres + ' ' + reg.apellidos,
            evento: ev.nombre,
            subject: `🎟️ Tu QR para ${ev.nombre}`
          })
        });
        msg.textContent=`QR enviado a ${reg.email} (revisa spam) + mostrado aquí`;
        msg.className='text-xs p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-200';
      }catch(emailErr){
        console.error(emailErr);
        msg.textContent=`Registro OK pero email falló (muestra este QR). Error: ${emailErr.message}`;
        msg.className='text-xs p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-200';
      }
    } else {
      msg.textContent=`Registro OK: ${reg.id.slice(0,8)} - Configura APPS_SCRIPT_EMAIL_URL para enviar email`;
      msg.className='text-xs p-3 rounded-xl bg-white/10';
    }
    
  }catch(err){
    msg.textContent='Error: '+err.message;
    msg.className='text-xs p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-200';
  } finally {
    btn.disabled=false; btn.textContent='Registrar y enviar QR';
  }
});

window.addEventListener('load', ()=>{ supabaseClient=initClient(); });
</script>
</body>
</html>

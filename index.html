<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reserva entrada - Feria San Martín</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { cream:'#fffeea', cream2:'#fff9c5', yellow:'#ffe846', amber:'#ffba08', brownDeep:'#482000', pink:'#fe1954', cyan:'#04bdcf' } } } }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="config.js?v=11"></script>
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body class="min-h-screen bg-cream text-brownDeep p-4 md:p-8 flex items-center justify-center">
<div class="w-full max-w-5xl grid lg:grid-cols-2 gap-6 items-start">
  <div class="card p-8 md:p-10">
    <div id="eventInfo">Cargando evento...</div>
  </div>
  <div class="card p-8">
    <div id="stepEmail">
      <h2 class="font-display font-black text-3xl">Reserva tu entrada</h2>
      <p class="text-sm opacity-60 mt-2">Ingresa tu correo para verificar si ya tienes QR</p>
      <input id="emailCheck" type="email" placeholder="tu@correo.com" class="input mt-6">
      <button id="btnVerificar" class="btn-primary w-full mt-4 py-4">Continuar</button>
      <div id="emailStatus" class="hidden mt-4 p-4 rounded-[12px] text-sm"></div>
    </div>
    <div id="stepForm" class="hidden">
      <h2 class="font-display font-black text-2xl">Completa tus datos</h2>
      <p class="text-sm opacity-60 mt-1">Correo: <span id="verifiedEmail" class="font-bold text-brownDeep"></span></p>
      <form id="registrationForm" class="mt-6 grid gap-3">
        <div class="grid grid-cols-2 gap-3"><input id="nombres" required placeholder="Nombres" class="input"><input id="apellidos" required placeholder="Apellidos" class="input"></div>
        <input id="nombreEstudiante" required placeholder="Nombre estudiante" class="input">
        <input id="dni" required pattern="[0-9]{8}" maxlength="8" placeholder="DNI adulto 8 dígitos" class="input">
        <div class="grid grid-cols-2 gap-3"><input id="gradoSeccion" required placeholder="Grado y sección" class="input"><input id="parentesco" required placeholder="Parentesco" class="input"></div>
        <button id="btnEnviar" type="submit" class="btn-primary w-full py-4 mt-2">Reservar mi entrada</button>
        <div id="formStatus" class="hidden p-4 rounded-[12px] text-sm"></div>
      </form>
    </div>
    <div id="stepExists" class="hidden text-center">
      <h2 class="font-display font-black text-2xl">¡Ya tienes entrada!</h2>
      <div id="qrExists" class="mt-6 flex justify-center bg-white p-4 rounded-[20px] border"></div>
      <p id="existsId" class="mt-4 font-mono badge badge-cream"></p>
      <button id="btnReenviar" class="btn-amber w-full mt-6 py-4">Reenviar QR a mi correo</button>
    </div>
  </div>
</div>
<div id="qrHidden" class="hidden"></div>
<script>
let activeEvent=null, currentEmail="";
async function loadActiveEvent(){
  const client = window.initSupabaseClient ? window.initSupabaseClient() : supabase;
  const {data, error} = await client.from('events').select('*').eq('activo',true).limit(1).single();
  if(error || !data){ document.getElementById('eventInfo').innerHTML='<div class="text-center py-12"><p class="text-3xl">😴</p><p class="font-bold mt-4">No hay inscripciones abiertas</p></div>'; return; }
  activeEvent=data;
  const img = data.imagen_url || data.image_url || '';
  document.getElementById('eventInfo').innerHTML=`
    <div class="flex gap-4 items-start">
      <div class="event-square w-16 h-16 shrink-0">${img? `<img src="${img}">` : data.nombre[0]}</div>
      <div>
        <div class="badge badge-amber mb-2">● Inscripciones abiertas</div>
        <h1 class="font-display font-black text-4xl leading-[0.9]">${data.nombre}</h1>
        <p class="opacity-60 mt-3 text-sm">${data.descripcion||''}</p>
      </div>
    </div>
    <div class="mt-6 card-cream p-5 rounded-[16px]"><p class="text-sm font-medium">${data.mensaje_bienvenida||''}</p></div>
    <div class="mt-4 flex gap-2"><span class="badge badge-cream">${data.fecha||''}</span><span class="badge badge-brown">QR único</span></div>
  `;
}
function showStatus(el, t, type){ el.classList.remove('hidden'); el.className='mt-4 p-4 rounded-[12px] text-sm '+(type==='success'?'bg-green-50 border border-green-200 text-green-800':type==='error'?'bg-pink/10 border border-pink/20 text-pink':'bg-cream2 border border-brownDeep/10'); el.textContent=t; }
async function checkEmail(){
  const email=document.getElementById('emailCheck').value.trim().toLowerCase(); const status=document.getElementById('emailStatus');
  if(!email.includes('@')){ showStatus(status,'Correo inválido','error'); return; }
  const client = window.initSupabaseClient ? window.initSupabaseClient() : supabase;
  const {data} = await client.from('registrations').select('*').eq('event_id', activeEvent.id).eq('email', email).single();
  if(data){ currentEmail=email; document.getElementById('stepEmail').classList.add('hidden'); document.getElementById('stepExists').classList.remove('hidden'); document.getElementById('existsId').textContent='ID: '+data.id; document.getElementById('qrExists').innerHTML=''; new QRCode(document.getElementById('qrExists'), {text: data.id, width:200, height:200}); }
  else{ currentEmail=email; document.getElementById('verifiedEmail').textContent=email; document.getElementById('stepEmail').classList.add('hidden'); document.getElementById('stepForm').classList.remove('hidden'); }
}
async function register(e){
  e.preventDefault(); const status=document.getElementById('formStatus');
  const payload={event_id: activeEvent.id, nombres: document.getElementById('nombres').value.trim(), apellidos: document.getElementById('apellidos').value.trim(), nombre_estudiante: document.getElementById('nombreEstudiante').value.trim(), dni: document.getElementById('dni').value.trim(), grado_seccion: document.getElementById('gradoSeccion').value.trim(), parentesco: document.getElementById('parentesco').value.trim(), email: currentEmail};
  showStatus(status,'Reservando...',''); const client = window.initSupabaseClient ? window.initSupabaseClient() : supabase;
  const {data, error} = await client.from('registrations').insert(payload).select().single();
  if(error){ if(error.code==='23505') showStatus(status,'Ya tienes entrada con ese correo','error'); else showStatus(status,error.message,'error'); return; }
  showStatus(status,`¡Reserva lista! ID: ${data.id} - Te enviamos QR a ${data.email}`,'success');
  document.getElementById('qrHidden').innerHTML=''; new QRCode(document.getElementById('qrHidden'), {text: data.id, width:300, height:300});
  setTimeout(async ()=>{ const qrCanvas=document.querySelector('#qrHidden canvas'); const qrDataUrl=qrCanvas? qrCanvas.toDataURL():''; try{ const driveUrl=window.APPS_SCRIPT_URL; if(driveUrl) await fetch(driveUrl,{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({to: data.email, id: data.id, nombre: data.nombres+' '+data.apellidos, evento: activeEvent.nombre})}); }catch(err){} }, 500);
}
document.getElementById('btnVerificar').addEventListener('click', checkEmail);
document.getElementById('registrationForm').addEventListener('submit', register);
document.getElementById('btnReenviar')?.addEventListener('click', async()=>{ const client=window.initSupabaseClient ? window.initSupabaseClient() : supabase; const {data}=await client.from('registrations').select('*').eq('event_id', activeEvent.id).eq('email', currentEmail).single(); if(data){ await fetch(window.APPS_SCRIPT_URL,{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({to: data.email, id: data.id, nombre: data.nombres+' '+data.apellidos, evento: activeEvent.nombre})}); alert('QR reenviado'); } });
window.addEventListener('load', loadActiveEvent);
</script>
</body>
</html>

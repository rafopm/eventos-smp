<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scanner - Feria San Martín</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { cream:'#fffeea', cream2:'#fff9c5', yellow:'#ffe846', amber:'#ffba08', brownDeep:'#482000', pink:'#fe1954' } } } }
</script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="config.js?v=13"></script>
<link rel="stylesheet" href="styles.css?v=13">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Fraunces:opsz,wght@9..144,900&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream text-brownDeep p-4 md:p-8 flex flex-col">
<main class="w-full max-w-[480px] mx-auto flex-1 flex flex-col">
  <div class="text-center mb-6">
    <p class="text-[11px] font-black tracking-[0.2em] opacity-30">CONTROL INGRESO • SAN MARTÍN</p>
    <h1 class="font-display font-black text-[2rem] leading-none tracking-tight mt-2">Scanner QR</h1>
    <div class="mt-3 flex justify-center gap-2">
      <span id="eventTag" class="badge badge-cream text-[11px]">Conectando...</span>
      <span id="countTag" class="badge badge-amber text-[11px] hidden">0 ingresados</span>
    </div>
  </div>
  <!-- Selector evento si hay varios -->
  <div id="eventSelector" class="hidden card p-4 mb-4">
    <p class="text-[11px] font-black tracking-widest opacity-40">EVENTO ACTIVO</p>
    <div id="eventList" class="mt-2 grid gap-2"></div>
  </div>
  <div class="card p-4 md:p-6">
    <!-- Cámara con marco minimalista con esquinas -->
    <div class="relative rounded-[20px] overflow-hidden bg-black aspect-[4/3] border border-brownDeep/10">
      <div id="reader" class="w-full h-full"></div>
      <!-- Esquinas decorativas impactantes minimalistas -->
      <div class="pointer-events-none absolute inset-0">
        <div class="absolute top-4 left-4 w-8 h-8 border-t-[3px] border-l-[3px] border-amber rounded-tl-[12px]"></div>
        <div class="absolute top-4 right-4 w-8 h-8 border-t-[3px] border-r-[3px] border-amber rounded-tr-[12px]"></div>
        <div class="absolute bottom-4 left-4 w-8 h-8 border-b-[3px] border-l-[3px] border-amber rounded-bl-[12px]"></div>
        <div class="absolute bottom-4 right-4 w-8 h-8 border-b-[3px] border-r-[3px] border-amber rounded-br-[12px]"></div>
      </div>
      <div id="scanOverlay" class="absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-[2px]">
        <p class="text-white/70 text-sm font-bold">Cámara apagada</p>
      </div>
    </div>
    <button id="startBtn" class="btn-primary w-full mt-5 py-3.5">📷 Activar cámara</button>
    <div id="message" class="mt-4 p-4 rounded-[14px] bg-cream2 border border-brownDeep/5 text-[13px] text-center font-medium">Toca activar cámara para escanear QR de entrada</div>
    <div id="validationDetails" class="hidden mt-4 card-cream p-4 rounded-[14px]">
      <p class="text-[11px] font-black tracking-widest opacity-40">DETALLE</p>
      <div id="detailContent" class="mt-2 text-[13px] leading-snug"></div>
    </div>
    <button id="nextBtn" class="hidden btn-amber w-full mt-4 py-3">→ Escanear siguiente</button>
  </div>
  <div class="text-center mt-6">
    <p class="text-[11px] opacity-30">Escanea el QR del correo del visitante • Se valida contra el evento seleccionado</p>
    <div class="mt-3 flex justify-center gap-3">
      <a href="display.html" class="text-[11px] opacity-40 underline">Ver display →</a>
      <a href="resultados.html" class="text-[11px] opacity-40 underline">Resultados →</a>
    </div>
  </div>
</main>
<script>
let supabaseClient=null, html5QrCode=null, scanning=false, activeEvent=null, activeEvents=[];
function initClient(){
  supabaseClient = window.initSupabaseClient ? window.initSupabaseClient() : window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  return supabaseClient;
}
function renderEventInfo(ev){
  document.getElementById('eventTag').textContent = ev.nombre;
  document.getElementById('eventTag').className = 'badge badge-brown text-[11px]';
}
function renderEventSelector(events){
  const sel=document.getElementById('eventSelector'), list=document.getElementById('eventList');
  if(events.length<=1){ sel.classList.add('hidden'); return; }
  sel.classList.remove('hidden');
  list.innerHTML='';
  events.forEach(ev=>{
    const btn=document.createElement('button');
    btn.className=`w-full text-left p-3 rounded-[12px] border text-sm font-bold ${activeEvent && activeEvent.id===ev.id ? 'bg-brownDeep text-cream border-brownDeep' : 'bg-white border-brownDeep/10'}`;
    btn.textContent=ev.nombre;
    btn.onclick=()=>{ activeEvent=ev; renderEventInfo(ev); renderEventSelector(events); loadCount(); };
    list.appendChild(btn);
  });
}
async function loadActiveEvents(){
  const {data} = await supabaseClient.from('events').select('*').eq('activo',true).order('fecha',{ascending:false});
  activeEvents=data||[];
  if(activeEvents.length>0){
    activeEvent=activeEvents[0];
    renderEventInfo(activeEvent);
    renderEventSelector(activeEvents);
    loadCount();
  } else {
    document.getElementById('eventTag').textContent='Sin evento activo';
  }
}
async function loadCount(){
  if(!activeEvent) return;
  const {count} = await supabaseClient.from('registrations').select('*', {count:'exact', head:true}).eq('event_id', activeEvent.id).eq('estado','INGRESADO');
  if(count!==null){
    document.getElementById('countTag').classList.remove('hidden');
    document.getElementById('countTag').textContent=`${count} ingresados`;
  }
}
async function onScanSuccess(decoded){
  const id = decoded.trim();
  const msg=document.getElementById('message');
  const details=document.getElementById('validationDetails');
  const detailContent=document.getElementById('detailContent');
  msg.textContent='Verificando '+id.slice(0,8)+'...';
  msg.className='mt-4 p-4 rounded-[14px] bg-cream2 border border-brownDeep/5 text-[13px] text-center';
  if(html5QrCode) try{ await html5QrCode.pause(true); }catch(e){}
  scanning=false;
  document.getElementById('scanOverlay').classList.remove('hidden');
  const {data: reg, error} = await supabaseClient.from('registrations').select('*').eq('id', id).maybeSingle();
  if(error || !reg){
    msg.textContent='🚫 QR no válido o no encontrado';
    msg.className='mt-4 p-4 rounded-[14px] bg-pink/10 border border-pink/20 text-pink text-[13px] text-center font-bold';
    document.getElementById('nextBtn').classList.remove('hidden');
    return;
  }
  if(activeEvent && reg.event_id !== activeEvent.id){
    msg.textContent='🚫 Este ticket es de otro evento';
    msg.className='mt-4 p-4 rounded-[14px] bg-pink/10 border border-pink/20 text-pink text-[13px] text-center font-bold';
    detailContent.innerHTML=`<b>${reg.nombres} ${reg.apellidos}</b><br>Evento ticket: ${reg.event_id.slice(0,8)}<br>Evento activo: ${activeEvent.nombre}`;
    details.classList.remove('hidden');
    document.getElementById('nextBtn').classList.remove('hidden');
    return;
  }
  if(reg.estado === 'INGRESADO'){
    msg.textContent=`⚠️ Ya ingresó a las ${reg.hora_ingreso ? new Date(reg.hora_ingreso).toLocaleTimeString() : ''}`;
    msg.className='mt-4 p-4 rounded-[14px] bg-amber/20 border border-amber/30 text-brownDeep text-[13px] text-center font-bold';
    detailContent.innerHTML=`<b class="font-display text-[16px]">${reg.nombres} ${reg.apellidos}</b><br><span class="opacity-60">${reg.nombre_estudiante} • ${reg.grado_seccion}</span><br><span class="badge badge-cream mt-2">${reg.email}</span>`;
    details.classList.remove('hidden');
    document.getElementById('nextBtn').classList.remove('hidden');
    return;
  }
  const {error: upErr} = await supabaseClient.from('registrations').update({estado:'INGRESADO', hora_ingreso: new Date().toISOString()}).eq('id', id);
  if(upErr){
    msg.textContent='Error actualizando: '+upErr.message;
    msg.className='mt-4 p-4 rounded-[14px] bg-pink/10 border border-pink/20 text-pink';
  } else {
    msg.textContent=`✅ BIENVENIDO: ${reg.nombres} ${reg.apellidos}`;
    msg.className='mt-4 p-4 rounded-[14px] bg-green-50 border border-green-200 text-green-800 text-[13px] text-center font-black';
    detailContent.innerHTML=`<b class="font-display text-[18px]">${reg.nombres} ${reg.apellidos}</b><br>${reg.parentesco} de ${reg.nombre_estudiante}<br><span class="opacity-60">DNI: ${reg.dni}</span><br><span class="badge badge-green mt-2">VOTO HABILITADO</span>`;
    details.classList.remove('hidden');
    loadCount();
  }
  document.getElementById('nextBtn').classList.remove('hidden');
}
async function startScanner(){
  const reader = document.getElementById('reader');
  html5QrCode=new Html5Qrcode('reader');
  document.getElementById('scanOverlay').classList.add('hidden');
  try{
    await html5QrCode.start({facingMode:'environment'}, {fps:10, qrbox:{width:250,height:250}}, onScanSuccess, ()=>{});
    scanning=true;
    document.getElementById('startBtn').classList.add('hidden');
    document.getElementById('message').textContent='Apunta al QR del visitante';
  }catch(err){
    document.getElementById('message').textContent='Error cámara: '+err;
    document.getElementById('scanOverlay').classList.remove('hidden');
  }
}
document.getElementById('startBtn').addEventListener('click', startScanner);
document.getElementById('nextBtn').addEventListener('click', async()=>{
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('validationDetails').classList.add('hidden');
  document.getElementById('message').textContent='Listo para escanear';
  document.getElementById('message').className='mt-4 p-4 rounded-[14px] bg-cream2 border border-brownDeep/5 text-[13px] text-center';
  document.getElementById('scanOverlay').classList.add('hidden');
  if(html5QrCode){ try{ await html5QrCode.resume(); scanning=true; }catch(e){} }
});
window.addEventListener('load', async()=>{ initClient(); await loadActiveEvents(); });
</script>
</body>
</html>

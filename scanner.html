<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scanner - Feria San Martín</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { colors: { cream:'#fffeea', amber:'#ffba08', brownDeep:'#482000', pink:'#fe1954' } } } }</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="config.js?v=11"></script>
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body class="min-h-screen bg-cream text-brownDeep p-6">
<main class="max-w-2xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="font-display font-black text-2xl">Scanner QR</h1>
    <span id="eventTag" class="badge badge-cream">Conectando...</span>
  </div>
  <div class="card p-6">
    <div id="reader" class="rounded-[16px] overflow-hidden"></div>
    <input id="manualId" placeholder="ID manual (si QR no lee)" class="input mt-4">
    <button id="btnManual" class="btn-primary w-full mt-3">Validar manual</button>
    <div id="result" class="mt-6 hidden card-cream p-5 rounded-[16px]"></div>
  </div>
</main>
<script>
let supabaseClient=null, activeEvent=null, html5QrCode=null;
function initClient(){ supabaseClient = window.initSupabaseClient ? window.initSupabaseClient() : window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY); return supabaseClient; }
async function loadActiveEvent(){ const {data}=await supabaseClient.from('events').select('*').eq('activo',true).limit(1).single(); activeEvent=data; document.getElementById('eventTag').textContent=data?.nombre||'Sin evento'; return data; }
async function validate(id){
  const resultEl=document.getElementById('result'); resultEl.classList.remove('hidden'); resultEl.innerHTML='Validando...';
  try{
    const {data: reg, error} = await supabaseClient.from('registrations').select('*').eq('id', id).eq('event_id', activeEvent.id).single();
    if(error || !reg){ resultEl.innerHTML=`<p class="text-pink font-bold">❌ No encontrado</p><p class="text-xs opacity-60">ID: ${id}</p>`; return; }
    if(reg.estado==='INGRESADO'){ resultEl.innerHTML=`<p class="font-bold text-orange">⚠️ Ya ingresó</p><p class="font-black text-lg">${reg.nombres} ${reg.apellidos}</p><p class="text-xs opacity-60">${reg.estado} - ${reg.email}</p>`; return; }
    const {error: upErr} = await supabaseClient.from('registrations').update({estado:'INGRESADO', checked_in_at: new Date().toISOString()}).eq('id', reg.id);
    if(upErr) throw upErr;
    resultEl.innerHTML=`<div class="text-center"><div class="w-16 h-16 bg-green-500 text-white rounded-full flex items-center justify-center mx-auto text-2xl">✓</div><p class="font-display font-black text-2xl mt-3">${reg.nombres} ${reg.apellidos}</p><p class="text-sm opacity-60">${reg.nombre_estudiante} - ${reg.grado_seccion}</p><p class="badge badge-green mt-3">INGRESADO</p></div>`;
  }catch(err){ resultEl.innerHTML=`<p class="text-pink">Error: ${err.message}</p>`; }
}
window.addEventListener('load', async()=>{
  initClient(); await loadActiveEvent();
  html5QrCode=new Html5Qrcode("reader");
  html5QrCode.start({facingMode:"environment"}, {fps:10, qrbox:{width:250, height:250}}, (decoded)=>{ validate(decoded.trim()); }, ()=>{});
  document.getElementById('btnManual').addEventListener('click', ()=>{ const id=document.getElementById('manualId').value.trim(); if(id) validate(id); });
});
</script>
</body>
</html>

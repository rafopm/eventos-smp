<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin v3 Final</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script>
// Fallback hardcodeado por si config.js falla por cache
window.SUPABASE_URL = window.SUPABASE_URL || "https://pgnlafozaukhdqlxfcfk.supabase.co";
window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "sb_publishable_pVJiDol9813vN_wCbuRT0w_w1vDatSz";
</script>
<script src="config-simple.js?v=3"></script>
</head>
<body class="min-h-screen bg-[#10130c] text-white p-6">
<main class="max-w-3xl mx-auto">
<h1 class="text-2xl font-black">Admin v3 Final - Seguro</h1>
<div id="status" class="mt-2 text-xs"></div>

<section id="loginSection" class="mt-6 bg-white/[0.05] border border-white/10 rounded-2xl p-6">
<input id="loginEmail" type="email" value="eventos@colegiosanmartin.edu.pe" class="w-full rounded-xl bg-white/[0.06] border border-white/10 px-4 py-3">
<input id="loginPass" type="password" placeholder="Contraseña" class="mt-2 w-full rounded-xl bg-white/[0.06] border border-white/10 px-4 py-3">
<button id="btnLogin" class="mt-3 w-full bg-lime-300 text-black font-bold py-3 rounded-xl">Entrar</button>
<p id="loginMsg" class="mt-2 text-sm"></p>
</section>

<div id="adminContent" class="hidden">
<p id="userInfo" class="mt-4 text-sm text-lime-300"></p>
<div id="eventList" class="mt-6 grid gap-2"></div>
<form id="eventForm" class="mt-6 grid gap-3 max-w-lg bg-white/[0.03] p-4 rounded-xl">
<input id="evNombre" required placeholder="Nombre evento" class="rounded-xl bg-white/[0.06] border border-white/10 px-4 py-3">
<button class="bg-lime-300 text-black font-bold py-2 rounded-xl">Crear evento de prueba</button>
</form>
<button id="logoutBtn" class="mt-6 text-xs bg-white/10 px-3 py-1.5 rounded-lg">Cerrar sesión</button>
</div>
</main>
<script>
let supabaseClient;
function init(){
  const url = window.SUPABASE_URL;
  const key = window.SUPABASE_ANON_KEY;
  document.getElementById('status').textContent = `URL: ${url} | KEY: ${key.slice(0,20)}...`;
  if(!window.supabase?.createClient){ document.getElementById('status').textContent='ERROR CDN supabase no cargó'; return null; }
  supabaseClient = window.supabase.createClient(url, key);
  window.supabaseClient = supabaseClient;
  return supabaseClient;
}
async function checkSession(){
  const {data: {session}} = await supabaseClient.auth.getSession();
  if(session){
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('adminContent').classList.remove('hidden');
    document.getElementById('userInfo').textContent = `Logueado: ${session.user.email}`;
    loadEvents();
  }
}
async function loadEvents(){
  const {data, error} = await supabaseClient.from('events').select('*').limit(10);
  const list=document.getElementById('eventList'); list.innerHTML='';
  if(error){ list.innerHTML=`Error: ${error.message}`; return; }
  data.forEach(ev=>{ list.innerHTML+=`<div class="p-2 bg-white/5 rounded">${ev.nombre}</div>`; });
}
document.getElementById('btnLogin').addEventListener('click', async(e)=>{
  e.preventDefault();
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const {data, error} = await supabaseClient.auth.signInWithPassword({email, password: pass});
  const msg=document.getElementById('loginMsg');
  if(error){ msg.textContent=error.message; msg.className='text-red-300'; }
  else{ checkSession(); }
});
document.getElementById('eventForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const nombre=document.getElementById('evNombre').value;
  const {error} = await supabaseClient.from('events').insert({nombre, activo:true, welcome_delay_seconds:0, welcome_duration_seconds:9});
  if(error) alert(error.message); else { alert('Creado!'); loadEvents(); }
});
document.getElementById('logoutBtn').addEventListener('click', async()=>{ await supabaseClient.auth.signOut(); location.reload(); });
window.addEventListener('load', ()=>{ supabaseClient=init(); if(supabaseClient) checkSession(); });
</script>
</body>
</html>

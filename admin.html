<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin - Feria San Martín</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { cream:'#fffeea', cream2:'#fff9c5', yellow:'#ffe846', amber:'#ffba08', brownDeep:'#482000', pink:'#fe1954' } } } }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="config.js?v=13"></script>
<link rel="stylesheet" href="styles.css?v=13">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Fraunces:opsz,wght@9..144,900&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream text-brownDeep">
<header class="sticky top-0 z-30 bg-white/80 backdrop-blur-xl border-b border-brownDeep/5">
  <div class="max-w-[1400px] mx-auto px-6 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-[10px] bg-brownDeep text-cream flex items-center justify-center font-black text-[12px]">A</div>
      <div><h1 class="font-display font-black text-[15px] leading-none">Admin Feria</h1><p class="text-[10px] opacity-40 font-bold tracking-widest">SAN MARTÍN • MINIMAL</p></div>
    </div>
    <div class="flex gap-1.5">
      <a href="display.html" target="_blank" class="btn-ghost text-[11px] py-1.5 px-3">📺 Display</a>
      <a href="resultados.html" target="_blank" class="btn-ghost text-[11px] py-1.5 px-3">🏆 Resultados</a>
      <a href="scanner.html" target="_blank" class="btn-primary text-[11px] py-1.5 px-3">📷 Scanner</a>
    </div>
  </div>
</header>
<main class="max-w-[1400px] mx-auto p-4 md:p-6 space-y-6">
<!-- EVENTS -->
<section class="grid lg:grid-cols-5 gap-5">
  <div class="lg:col-span-2 card p-5">
    <p class="text-[11px] font-black tracking-widest opacity-30">EVENTO</p>
    <h2 class="font-display font-black text-xl mt-1">Crear / Editar</h2>
    <form id="eventForm" class="mt-4 grid gap-3">
      <input type="hidden" id="eventId">
      <input id="evNombre" required placeholder="Nombre evento" class="input font-bold">
      <textarea id="evDesc" placeholder="Descripción corta" class="input" rows="2"></textarea>
      <div class="grid grid-cols-2 gap-2">
        <input id="evFecha" type="date" class="input">
        <input id="evImagen" placeholder="URL imagen" class="input">
      </div>
      <div class="card-cream p-3 rounded-[14px] border-dashed border-2 border-brownDeep/10">
        <label class="text-[11px] font-black">📸 Subir imagen</label>
        <input type="file" id="evImageFile" accept="image/*" class="mt-2 w-full text-[11px] file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:bg-brownDeep file:text-white file:font-bold">
        <p id="evImageStatus" class="text-[11px] mt-2 hidden"></p>
        <div id="evImagePreview" class="hidden mt-2"><img id="evPreviewImg" class="w-16 h-16 rounded-[12px] object-cover border"></div>
      </div>
      <textarea id="evMensaje" placeholder="Mensaje bienvenida - usa [NOMBRE]" class="input" rows="2"></textarea>
      <div class="grid grid-cols-2 gap-2">
        <label class="text-[11px] font-bold">Delay<input id="evDelay" type="number" value="0" class="input mt-1"></label>
        <label class="text-[11px] font-bold">Duración<input id="evDuracion" type="number" value="8" class="input mt-1"></label>
      </div>
      <div class="flex gap-3">
        <label class="flex items-center gap-2 text-[11px] font-bold"><input id="evActivo" type="checkbox"> Activo</label>
        <label class="flex items-center gap-2 text-[11px] font-bold"><input id="evBienvenidaActiva" type="checkbox" checked> Bienvenida ON</label>
      </div>
      <button class="btn-primary w-full py-3">Guardar evento</button>
    </form>
  </div>
  <div class="lg:col-span-3 card p-5">
    <div class="flex justify-between items-center">
      <p class="text-[11px] font-black tracking-widest opacity-30">EVENTOS ACTIVOS</p>
      <button id="btnReloadEvents" class="btn-ghost text-[11px] py-1 px-2">🔄</button>
    </div>
    <div id="eventList" class="mt-4 grid gap-2"></div>
  </div>
</section>
<section id="detailSection" class="hidden space-y-5">
  <div class="card p-5 flex gap-4 items-center border-l-4 border-l-amber">
    <div id="selectedEventSquare" class="w-14 h-14 rounded-[14px] bg-cream2 border border-brownDeep/5 overflow-hidden flex items-center justify-center font-black">SM</div>
    <div class="flex-1"><h2 class="font-display font-black text-xl">Config: <span id="selectedEventName" class="opacity-60"></span></h2><p id="selectedEventDesc" class="text-[12px] opacity-50"></p></div>
    <span id="selectedEventDate" class="badge badge-cream text-[10px]"></span>
  </div>
  <div class="grid lg:grid-cols-2 gap-5">
    <div class="card p-5">
      <p class="text-[11px] font-black tracking-widest opacity-30">CATEGORÍAS</p>
      <form id="catForm" class="mt-3 flex gap-2"><input id="catKey" required placeholder="key" class="input flex-1 text-[13px]"><input id="catLabel" required placeholder="Label" class="input flex-1 text-[13px]"><button class="btn-primary px-4 text-[12px]">+</button></form>
      <div id="catList" class="mt-4 grid gap-2"></div>
      <div class="mt-6 pt-4 border-t border-brownDeep/5">
        <p class="text-[11px] font-black tracking-widest opacity-30">VOTACIÓN</p>
        <div id="voteControls" class="mt-3 grid gap-2"></div>
      </div>
    </div>
    <div class="card p-5">
      <p class="text-[11px] font-black tracking-widest opacity-30">CREAR PROYECTO RÁPIDO</p>
      <form id="projForm" class="mt-3 grid gap-2">
        <select id="projCat" class="input text-[13px]"></select>
        <input id="projTitle" required placeholder="Título" class="input text-[13px]">
        <input id="projTeam" placeholder="Equipo" class="input text-[13px]">
        <input id="projPhoto" placeholder="URL foto" class="input text-[13px]">
        <textarea id="projDesc" placeholder="Descripción" class="input text-[13px]" rows="2"></textarea>
        <label class="flex gap-2 text-[11px] font-bold"><input id="projActivo" type="checkbox" checked> Activo</label>
        <button class="btn-primary py-2 text-[12px]">Agregar</button>
      </form>
    </div>
  </div>
  <div class="card p-5">
    <div class="flex justify-between items-center flex-wrap gap-2">
      <div><p class="text-[11px] font-black tracking-widest opacity-30">GRUPOS • PRESENTACIONES</p><p class="text-[12px] opacity-50">Pendientes de aprobación</p></div>
      <div class="flex gap-2">
        <button id="btnShowPending" class="btn-amber text-[11px] py-1.5 px-3">Pendientes</button>
        <button id="btnShowAllGroups" class="btn-ghost text-[11px] py-1.5 px-3">Todos</button>
        <button id="btnRefreshGroups" class="btn-ghost text-[11px] py-1.5 px-3">🔄</button>
      </div>
    </div>
    <div id="groupsList" class="mt-4 grid md:grid-cols-2 gap-3"></div>
  </div>
  <div class="card p-5">
    <div class="flex justify-between items-center"><p class="text-[11px] font-black tracking-widest opacity-30">RESULTADOS RÁPIDOS</p><div class="flex gap-2"><button id="btnRefreshResults" class="btn-ghost text-[11px] py-1 px-2">🔄</button><button id="btnOpenResultados" class="btn-amber text-[11px] py-1 px-2">Abrir resultados</button></div></div>
    <div id="resultsByCat" class="mt-4 grid gap-4"></div>
  </div>
</section>
</main>
<!-- Modal edit -->
<div id="editModal" class="hidden fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="card p-6 w-full max-w-[480px]">
    <h3 class="font-black">Editar grupo</h3>
    <form id="editForm" class="mt-4 grid gap-3">
      <input type="hidden" id="editId">
      <input id="editTitle" class="input" placeholder="Título">
      <input id="editTeam" class="input" placeholder="Equipo">
      <textarea id="editDesc" class="input" rows="2" placeholder="Descripción"></textarea>
      <input id="editPhoto" class="input" placeholder="URL foto">
      <div class="flex gap-2"><button type="submit" class="btn-primary flex-1">Guardar</button><button type="button" id="btnCloseModal" class="btn-ghost flex-1">Cerrar</button></div>
    </form>
  </div>
</div>
<script>
let supabaseClient=null, selectedEventId=null, uploadedEventImageUrl=null, filterMode='pending', allGroups=[];
function initClient(){
  supabaseClient = window.initSupabaseClient ? window.initSupabaseClient() : window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  return supabaseClient;
}
async function loadEvents(){
  const {data} = await supabaseClient.from('events').select('*').order('fecha',{ascending:false});
  const list=document.getElementById('eventList'); list.innerHTML='';
  (data||[]).forEach(ev=>{
    const div=document.createElement('div');
    div.className=`flex gap-3 p-3 rounded-[12px] border cursor-pointer transition ${ev.activo ? 'border-amber bg-amber/10 border-l-4 border-l-amber' : 'border-brownDeep/5 bg-white'}`;
    div.innerHTML=`<div class="w-10 h-10 rounded-[10px] bg-cream2 overflow-hidden shrink-0">${ev.imagen_url||ev.image_url?`<img src="${ev.imagen_url||ev.image_url}" class="w-full h-full object-cover">`:`<div class="w-full h-full flex items-center justify-center font-black text-[11px]">${ev.nombre.slice(0,2).toUpperCase()}</div>`}</div><div class="flex-1 min-w-0"><p class="font-bold text-[13px] truncate">${ev.nombre}</p><p class="text-[11px] opacity-50 truncate">${ev.descripcion||''}</p></div><span class="badge ${ev.activo?'badge-amber':'badge-cream'} text-[10px]">${ev.activo?'ACTIVO':''}</span>`;
    div.onclick=()=>selectEvent(ev.id);
    list.appendChild(div);
  });
}
async function selectEvent(id){
  selectedEventId=id;
  document.getElementById('detailSection').classList.remove('hidden');
  const {data: ev} = await supabaseClient.from('events').select('*').eq('id', id).single();
  document.getElementById('selectedEventName').textContent=ev.nombre;
  document.getElementById('selectedEventDesc').textContent=ev.descripcion||'';
  document.getElementById('selectedEventDate').textContent=ev.fecha? new Date(ev.fecha).toLocaleDateString():'';
  const square=document.getElementById('selectedEventSquare');
  const img=ev.imagen_url||ev.image_url;
  square.innerHTML= img ? `<img src="${img}" class="w-full h-full object-cover">` : ev.nombre.slice(0,2).toUpperCase();
  loadCategories(); loadVoteControls(); loadProjectsAndGroups(); loadResultsByCategory();
}
function editEvent(id){
  // cargar datos al form principal
  supabaseClient.from('events').select('*').eq('id', id).single().then(({data})=>{
    document.getElementById('eventId').value=data.id;
    document.getElementById('evNombre').value=data.nombre;
    document.getElementById('evDesc').value=data.descripcion||'';
    document.getElementById('evFecha').value=data.fecha||'';
    document.getElementById('evImagen').value=data.imagen_url||data.image_url||'';
    document.getElementById('evMensaje').value=data.mensaje_bienvenida||'';
    document.getElementById('evDelay').value=data.welcome_delay_seconds||0;
    document.getElementById('evDuracion').value=data.welcome_duration_seconds||8;
    document.getElementById('evActivo').checked=data.activo;
    window.scrollTo({top:0, behavior:'smooth'});
  });
}
async function toggleActive(id, current){
  await supabaseClient.from('events').update({activo:!current}).eq('id', id);
  if(!current){ await supabaseClient.from('events').update({activo:false}).neq('id', id); }
  loadEvents();
}
async function loadCategories(){
  const {data} = await supabaseClient.from('categories').select('*').eq('event_id', selectedEventId).order('orden');
  const catList=document.getElementById('catList'); const projCat=document.getElementById('projCat');
  catList.innerHTML=''; projCat.innerHTML='';
  (data||[]).forEach(c=>{
    catList.innerHTML+=`<div class="flex justify-between items-center p-2 rounded-[10px] bg-cream2"><span class="text-[13px] font-bold">${c.label} <span class="opacity-40 font-mono text-[11px]">(${c.key})</span></span><button onclick="deleteCat('${c.id}')" class="text-[11px] opacity-40">✕</button></div>`;
    projCat.innerHTML+=`<option value="${c.id}">${c.label}</option>`;
  });
}
async function loadVoteControls(){
  const {data} = await supabaseClient.from('categories').select('*').eq('event_id', selectedEventId).order('orden');
  const container=document.getElementById('voteControls'); container.innerHTML='';
  (data||[]).forEach(c=>{
    container.innerHTML+=`<div class="flex justify-between items-center p-2 rounded-[10px] border border-brownDeep/5"><span class="text-[12px] font-bold">${c.label}</span><div class="flex gap-2"><button onclick="toggleVote('${c.id}', true)" class="btn-ghost text-[10px] py-1 px-2 ${c.votacion_abierta?'bg-green-50 border-green-200':''}">Abrir</button><button onclick="toggleVote('${c.id}', false)" class="btn-ghost text-[10px] py-1 px-2 ${!c.votacion_abierta?'bg-brownDeep text-white':''}">Cerrar</button></div></div>`;
  });
}
async function loadProjectsAndGroups(){
  const {data} = await supabaseClient.from('projects').select('*, categories(label)').eq('event_id', selectedEventId).order('created_at',{ascending:false});
  allGroups=data||[]; renderGroups();
}
function renderGroups(){
  const container=document.getElementById('groupsList');
  let filtered = allGroups;
  if(filterMode==='pending') filtered = allGroups.filter(g=>g.estado_registro==='PENDIENTE' || !g.activo);
  container.innerHTML='';
  if(filtered.length===0) container.innerHTML='<p class="text-[12px] opacity-30 col-span-2">No hay grupos en este filtro</p>';
  filtered.forEach(g=>{
    const div=document.createElement('div');
    div.className=`p-4 rounded-[14px] border ${g.activo?'border-green-200 bg-green-50/30':'border-amber/30 bg-amber/5'} flex gap-3`;
    div.innerHTML=`
      <div class="w-14 h-14 rounded-[10px] overflow-hidden bg-cream2 shrink-0">${g.photo_url?`<img src="${g.photo_url}" class="w-full h-full object-cover">`:`<div class="w-full h-full flex items-center justify-center text-[10px] font-black opacity-20">SM</div>`}</div>
      <div class="flex-1 min-w-0">
        <p class="font-bold text-[13px] truncate">${g.title}</p>
        <p class="text-[11px] opacity-50 truncate">${g.team||''} • ${g.categories?.label||''}</p>
        <p class="text-[11px] opacity-40 mt-1 truncate">${g.tipo_presentacion||''} ${g.grado_seccion||''}</p>
        <div class="mt-2 flex gap-1.5 flex-wrap">
          <span class="badge ${g.activo?'badge-green':'badge-amber'} text-[9px]">${g.activo?'APROBADO':'PENDIENTE'}</span>
          ${g.estado_registro?`<span class="badge badge-cream text-[9px]">${g.estado_registro}</span>`:''}
        </div>
        <div class="mt-2 flex gap-1.5">
          ${!g.activo?`<button onclick="approveGroup('${g.id}')" class="btn-amber text-[10px] py-1 px-2">Aprobar</button>`:''}
          <button onclick="openEditModal('${g.id}')" class="btn-ghost text-[10px] py-1 px-2">Editar</button>
          <button onclick="deleteProject('${g.id}')" class="btn-ghost text-[10px] py-1 px-2">Borrar</button>
        </div>
      </div>
    `;
    container.appendChild(div);
  });
}
async function approveGroup(id){
  await supabaseClient.from('projects').update({activo:true, estado_registro:'APROBADO'}).eq('id', id);
  loadProjectsAndGroups();
}
async function loadResultsByCategory(){
  const {data: cats} = await supabaseClient.from('categories').select('*').eq('event_id', selectedEventId).order('orden');
  const {data: projs} = await supabaseClient.from('projects').select('*').eq('event_id', selectedEventId);
  const {data: votes} = await supabaseClient.from('votes').select('project_id, category_id').eq('event_id', selectedEventId);
  const container=document.getElementById('resultsByCat'); container.innerHTML='';
  const votesByProj={}; votes?.forEach(v=>{ votesByProj[v.project_id]=(votesByProj[v.project_id]||0)+1; });
  (cats||[]).forEach(cat=>{
    const projsInCat = projs.filter(p=>p.category_id===cat.id).map(p=>({...p, votes: votesByProj[p.id]||0})).sort((a,b)=>b.votes-a.votes);
    const total=projsInCat.reduce((s,p)=>s+p.votes,0);
    let html=`<div><p class="font-bold text-[13px]">${cat.label} • ${total} votos</p>`;
    projsInCat.slice(0,3).forEach((p,i)=>{
      const pct=total?Math.round(p.votes/total*100):0;
      html+=`<div class="mt-2 flex gap-2 items-center text-[12px]"><span class="font-display font-black opacity-20">${String(i+1).padStart(2,'0')}</span><span class="flex-1 truncate">${p.title}</span><span class="font-mono font-bold">${p.votes}</span><div class="w-12 h-1 bg-brownDeep/10 rounded-full"><div class="h-full bg-brownDeep/40" style="width:${pct}%"></div></div></div>`;
    });
    html+=`</div>`;
    container.innerHTML+=html;
  });
}
function openEditModal(id){
  const g=allGroups.find(x=>x.id===id); if(!g) return;
  document.getElementById('editId').value=g.id;
  document.getElementById('editTitle').value=g.title;
  document.getElementById('editTeam').value=g.team||'';
  document.getElementById('editDesc').value=g.description||'';
  document.getElementById('editPhoto').value=g.photo_url||'';
  document.getElementById('editModal').classList.remove('hidden');
}
function closeEditModal(){ document.getElementById('editModal').classList.add('hidden'); }
document.getElementById('eventForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const id=document.getElementById('eventId').value;
  const payloadFull={nombre: document.getElementById('evNombre').value, descripcion: document.getElementById('evDesc').value, fecha: document.getElementById('evFecha').value||null, imagen_url: document.getElementById('evImagen').value||uploadedEventImageUrl||null, image_url: document.getElementById('evImagen').value||uploadedEventImageUrl||null, mensaje_bienvenida: document.getElementById('evMensaje').value, welcome_delay_seconds: parseInt(document.getElementById('evDelay').value)||0, welcome_duration_seconds: parseInt(document.getElementById('evDuracion').value)||8, activo: document.getElementById('evActivo').checked, bienvenida_activa: document.getElementById('evBienvenidaActiva').checked};
  const payloadMinimal={nombre: payloadFull.nombre, descripcion: payloadFull.descripcion, fecha: payloadFull.fecha, mensaje_bienvenida: payloadFull.mensaje_bienvenida, activo: payloadFull.activo};
  if(payloadFull.activo){ await supabaseClient.from('events').update({activo:false}).neq('id','00000000-0000-0000-0000-000000000000'); }
  let res;
  if(id){ res = await supabaseClient.from('events').update(payloadFull).eq('id',id).select().single(); if(res.error) res = await supabaseClient.from('events').update(payloadMinimal).eq('id',id).select().single(); }
  else { res = await supabaseClient.from('events').insert(payloadFull).select().single(); if(res.error) res = await supabaseClient.from('events').insert(payloadMinimal).select().single(); }
  if(res.error){ alert('Error: '+res.error.message); return; }
  document.getElementById('eventForm').reset(); document.getElementById('eventId').value=''; document.getElementById('evImagePreview').classList.add('hidden'); uploadedEventImageUrl=null; loadEvents();
});
document.getElementById('evImageFile').addEventListener('change', async e=>{
  const file=e.target.files[0]; if(!file) return;
  const status=document.getElementById('evImageStatus'), preview=document.getElementById('evImagePreview'), img=document.getElementById('evPreviewImg');
  preview.classList.remove('hidden'); img.src=URL.createObjectURL(file); status.classList.remove('hidden'); status.textContent='📤 Subiendo...'; status.className='badge badge-cream';
  try{
    const base64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
    const resp=await fetch(window.APPS_SCRIPT_URL,{method:'POST', body: JSON.stringify({fileName:file.name, mimeType:file.type, base64Data:base64})});
    const result=await resp.json();
    if(result.success||result.ok){ uploadedEventImageUrl=result.url; document.getElementById('evImagen').value=result.url; status.textContent='✅ OK'; status.className='badge badge-green'; }
    else throw new Error(result.error);
  }catch(err){ status.textContent='❌ '+err.message; status.className='badge badge-pink'; }
});
document.getElementById('catForm').addEventListener('submit', async e=>{ e.preventDefault(); await supabaseClient.from('categories').insert({event_id:selectedEventId, key:document.getElementById('catKey').value, label:document.getElementById('catLabel').value}); e.target.reset(); loadCategories(); loadVoteControls(); loadResultsByCategory(); });
document.getElementById('projForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const payload={ event_id:selectedEventId, category_id:document.getElementById('projCat').value, title:document.getElementById('projTitle').value, team:document.getElementById('projTeam').value, photo_url:document.getElementById('projPhoto').value||null, description:document.getElementById('projDesc').value||null, activo: document.getElementById('projActivo').checked, estado_registro: document.getElementById('projActivo').checked ? 'APROBADO' : 'PENDIENTE' };
  let res = await supabaseClient.from('projects').insert(payload).select().single();
  if(res.error && res.error.message.includes('description')){ res = await supabaseClient.from('projects').insert({event_id:payload.event_id, category_id:payload.category_id, title:payload.title, team:payload.team, photo_url:payload.photo_url, activo:payload.activo}).select().single(); }
  if(res.error){ alert(res.error.message); return; }
  e.target.reset(); loadProjectsAndGroups(); loadResultsByCategory();
});
document.getElementById('editForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const id=document.getElementById('editId').value;
  await supabaseClient.from('projects').update({title:document.getElementById('editTitle').value, team:document.getElementById('editTeam').value, description:document.getElementById('editDesc').value, photo_url:document.getElementById('editPhoto').value||null}).eq('id', id);
  closeEditModal(); loadProjectsAndGroups();
});
window.toggleVote=async(id, open)=>{ await supabaseClient.from('categories').update({votacion_abierta:open}).eq('id',id); loadVoteControls(); };
window.deleteCat=async(id)=>{ if(confirm('Borrar categoria?')){ await supabaseClient.from('categories').delete().eq('id',id); loadCategories(); } };
window.deleteProject=async(id)=>{ if(confirm('Borrar?')){ await supabaseClient.from('projects').delete().eq('id',id); loadProjectsAndGroups(); } };
window.selectEvent=selectEvent; window.editEvent=editEvent; window.toggleActive=toggleActive; window.openEditModal=openEditModal;
document.getElementById('btnCloseModal').addEventListener('click', closeEditModal);
document.getElementById('editModal').addEventListener('click', (e)=>{ if(e.target.id==='editModal') closeEditModal(); });
document.getElementById('btnRefreshGroups').addEventListener('click', loadProjectsAndGroups);
document.getElementById('btnShowPending').addEventListener('click', ()=>{ filterMode='pending'; renderGroups(); });
document.getElementById('btnShowAllGroups').addEventListener('click', ()=>{ filterMode='all'; renderGroups(); });
document.getElementById('btnRefreshResults').addEventListener('click', loadResultsByCategory);
document.getElementById('btnOpenResultados').addEventListener('click', ()=>{ window.open('resultados.html?event='+selectedEventId,'_blank'); });
document.getElementById('btnReloadEvents').addEventListener('click', loadEvents);
window.addEventListener('load', ()=>{ initClient(); loadEvents(); });
</script>
</body>
</html>

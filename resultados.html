<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resultados - Feria San Martín</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { cream:'#fffeea', cream2:'#fff9c5', yellow:'#ffe846', amber:'#ffba08', brownDeep:'#482000', pink:'#fe1954' } } } }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="config.js?v=13"></script>
<link rel="stylesheet" href="styles.css?v=13">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Fraunces:opsz,wght@9..144,900&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-cream text-brownDeep relative overflow-x-hidden">
<div class="fixed inset-0 pointer-events-none opacity-[0.03]" style="background-image: radial-gradient(var(--c-brown-deep) 1px, transparent 1px); background-size: 28px 28px;"></div>
<main class="relative z-10 max-w-[1120px] mx-auto p-6 md:p-10">
<header class="flex flex-wrap justify-between items-start gap-4">
  <div>
    <p class="text-[11px] font-black tracking-[0.2em] opacity-30">RESULTADOS EN VIVO • SAN MARTÍN</p>
    <h1 class="font-display font-black text-[clamp(2.5rem,5vw,4rem)] leading-[0.9] tracking-tight mt-2">Resultados</h1>
    <p id="eventName" class="font-bold text-[14px] mt-2 opacity-60">Cargando evento...</p>
    <p id="liveStats" class="text-[11px] font-mono opacity-40 mt-2">Conectando...</p>
  </div>
  <div class="flex gap-2">
    <button id="btnCelebrate" class="btn-amber text-[12px] py-2 px-4">🎉 Celebrar</button>
    <button id="btnFullscreen" class="btn-ghost text-[11px] py-2 px-3">⛶ Pantalla</button>
    <a href="admin.html" class="btn-ghost text-[11px] py-2 px-3">⚙️ Admin</a>
  </div>
</header>
<!-- Overall stats minimal -->
<div class="mt-8 grid grid-cols-3 gap-3">
  <div class="card p-4 text-center"><p class="text-[11px] font-black tracking-widest opacity-30">VOTOS</p><p id="totalVotes" class="font-display font-black text-3xl mt-1">0</p></div>
  <div class="card p-4 text-center"><p class="text-[11px] font-black tracking-widest opacity-30">INGRESADOS</p><p id="totalIngresados" class="font-display font-black text-3xl mt-1">0</p></div>
  <div class="card p-4 text-center"><p class="text-[11px] font-black tracking-widest opacity-30">CATEGORÍAS</p><p id="totalCats" class="font-display font-black text-3xl mt-1">0</p></div>
</div>
<div id="resultsContainer" class="mt-10 grid gap-10"></div>
<div class="mt-16 text-center">
  <p class="text-[11px] opacity-20">Actualización en tiempo real cada 10s • Presiona Celebrar para confetti</p>
  <div class="mt-4 flex justify-center gap-2">
    <a href="display.html" class="text-[11px] opacity-40 underline">Ver display bienvenida →</a>
    <span class="opacity-20">•</span>
    <a href="vote.html" class="text-[11px] opacity-40 underline">Ir a votación →</a>
  </div>
</div>
</main>
<script>
let supabaseClient=null, activeEvent=null, categories=[], projects=[], votes=[];
function initClient(){
  supabaseClient = window.initSupabaseClient ? window.initSupabaseClient() : window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  return supabaseClient;
}
function launchConfetti(){
  const duration=2500, end=Date.now()+duration;
  (function frame(){
    confetti({particleCount: 4, angle: 60, spread: 55, origin: {x:0}, colors: ['#ffba08','#482000','#ffe846']});
    confetti({particleCount: 4, angle: 120, spread: 55, origin: {x:1}, colors: ['#ffba08','#482000','#ffe846']});
    if(Date.now()<end) requestAnimationFrame(frame);
  }());
  confetti({particleCount: 120, spread: 80, origin: {y:0.65}, colors: ['#ffba08','#ffe846','#482000']});
}
async function loadActiveEvent(){
  try{
    let eventId = new URLSearchParams(window.location.search).get('event');
    let query = supabaseClient.from('events').select('*');
    if(eventId){ query = query.eq('id', eventId).single(); }
    else { query = query.eq('activo', true).order('created_at',{ascending:false}).limit(1).single(); }
    const {data, error} = await query;
    if(error) throw error;
    activeEvent=data;
    document.getElementById('eventName').textContent=data.nombre;
    return data;
  }catch(err){
    document.getElementById('eventName').textContent='Error: '+err.message;
    return null;
  }
}
async function loadData(){
  if(!activeEvent) return;
  const [{data: cats}, {data: projs}, {data: vs}, {data: regs}] = await Promise.all([
    supabaseClient.from('categories').select('*').eq('event_id', activeEvent.id).order('orden'),
    supabaseClient.from('projects').select('*').eq('event_id', activeEvent.id).order('orden'),
    supabaseClient.from('votes').select('project_id, category_id').eq('event_id', activeEvent.id),
    supabaseClient.from('registrations').select('estado').eq('event_id', activeEvent.id)
  ]);
  categories=cats||[]; projects=projs||[]; votes=vs||[];
  document.getElementById('totalVotes').textContent=votes.length;
  document.getElementById('totalIngresados').textContent=regs?.filter(r=>r.estado==='INGRESADO').length||0;
  document.getElementById('totalCats').textContent=categories.length;
  document.getElementById('liveStats').textContent=`En vivo • ${votes.length} votos • Actualizado ${new Date().toLocaleTimeString()}`;
  renderResults();
}
function renderResults(){
  const container=document.getElementById('resultsContainer');
  container.innerHTML='';
  const votesByProject={}; votes.forEach(v=>{ votesByProject[v.project_id]=(votesByProject[v.project_id]||0)+1; });
  categories.forEach(cat=>{
    const projsInCat = projects.filter(p=>p.category_id===cat.id);
    const results = projsInCat.map(p=>({...p, votes: votesByProject[p.id]||0})).sort((a,b)=>b.votes-a.votes);
    const totalInCat = results.reduce((s,p)=>s+p.votes,0);
    
    const section=document.createElement('section');
    section.className='card p-6 md:p-8';
    
    let html = `
      <div class="flex justify-between items-start">
        <div>
          <h2 class="font-display font-black text-[1.9rem] leading-none tracking-tight">${cat.label}</h2>
          <p class="text-[11px] font-bold tracking-widest opacity-30 mt-2">${cat.key} • ${results.length} proyectos • ${totalInCat} votos</p>
        </div>
        <span class="flex items-center gap-2 text-[11px] font-black tracking-widest">
          <span class="w-2 h-2 rounded-full ${cat.votacion_abierta?'bg-green-500 animate-pulse':'bg-brownDeep/20'}"></span>
          ${cat.votacion_abierta?'ABIERTA':'CERRADA'}
        </span>
      </div>
    `;
    if(results.length===0){
      html+=`<p class="mt-8 text-center text-[13px] opacity-30 py-8">No hay proyectos en esta categoría</p>`;
      section.innerHTML=html; container.appendChild(section); return;
    }
    // Podio minimalista impactante
    html+=`<div class="mt-8 grid md:grid-cols-3 gap-4 items-end">`;
    // 2do
    if(results[1]){
      const p=results[1]; const pct=totalInCat?Math.round(p.votes/totalInCat*100):0;
      html+=`
        <div class="order-2 md:order-1 bg-cream2 border border-brownDeep/5 rounded-[20px] p-5 text-center">
          <p class="font-display font-black text-[3rem] leading-none opacity-10">02</p>
          <p class="text-[10px] font-black tracking-widest opacity-40 -mt-2">SEGUNDO</p>
          <h3 class="font-bold text-[15px] mt-3 leading-tight">${p.title}</h3>
          <p class="text-[11px] opacity-50 truncate">${p.team||''}</p>
          ${p.photo_url?`<img src="${p.photo_url}" class="mt-3 w-full h-[100px] object-cover rounded-[12px]">`:''}
          <div class="mt-3 h-1.5 bg-brownDeep/10 rounded-full overflow-hidden"><div class="h-full bg-brownDeep/40" style="width:${pct}%"></div></div>
          <p class="mt-2 font-mono text-[12px] font-bold">${p.votes} • ${pct}%</p>
        </div>`;
    }
    // 1ero - destacado
    const p1=results[0]; const pct1=totalInCat?Math.round(p1.votes/totalInCat*100):0;
    html+=`
      <div class="order-1 md:order-2 bg-brownDeep text-cream rounded-[24px] p-6 text-center relative overflow-hidden shadow-medium">
        <div class="absolute top-0 right-0 w-32 h-32 bg-amber/20 rounded-full blur-[30px] -translate-y-10 translate-x-10"></div>
        <p class="font-display font-black text-[4rem] leading-none text-amber/30">01</p>
        <p class="text-[10px] font-black tracking-[0.2em] text-amber -mt-2">CAMPEÓN</p>
        <h3 class="font-display font-black text-[1.5rem] leading-tight mt-3">${p1.title}</h3>
        <p class="text-[12px] text-cream/60 truncate">${p1.team||''}</p>
        ${p1.photo_url?`<img src="${p1.photo_url}" class="mt-4 w-full h-[160px] object-cover rounded-[16px] border border-white/10">`:''}
        <div class="mt-4 h-2 bg-white/10 rounded-full overflow-hidden"><div class="h-full bg-amber" style="width:${pct1}%"></div></div>
        <p class="mt-3 font-mono text-sm font-black text-amber">${p1.votes} votos • ${pct1}%</p>
      </div>`;
    // 3ero
    if(results[2]){
      const p=results[2]; const pct=totalInCat?Math.round(p.votes/totalInCat*100):0;
      html+=`
        <div class="order-3 bg-white border border-brownDeep/5 rounded-[20px] p-5 text-center">
          <p class="font-display font-black text-[3rem] leading-none opacity-10">03</p>
          <p class="text-[10px] font-black tracking-widest opacity-40 -mt-2">TERCERO</p>
          <h3 class="font-bold text-[14px] mt-3 leading-tight">${p.title}</h3>
          <p class="text-[11px] opacity-50 truncate">${p.team||''}</p>
          ${p.photo_url?`<img src="${p.photo_url}" class="mt-3 w-full h-[90px] object-cover rounded-[12px]">`:''}
          <div class="mt-3 h-1.5 bg-brownDeep/10 rounded-full overflow-hidden"><div class="h-full bg-brownDeep/20" style="width:${pct}%"></div></div>
          <p class="mt-2 font-mono text-[11px]">${p.votes} • ${pct}%</p>
        </div>`;
    }
    html+=`</div>`;
    if(results.length>3){
      html+=`<div class="mt-8 border-t border-brownDeep/5 pt-6"><p class="text-[11px] font-black tracking-widest opacity-30 mb-3">OTROS PUESTOS</p><div class="grid gap-2">`;
      results.slice(3).forEach((p, idx)=>{
        const place=idx+4; const pct=totalInCat?Math.round(p.votes/totalInCat*100):0;
        html+=`<div class="flex items-center gap-3 p-3 rounded-[12px] bg-cream2/60"><div class="font-display font-black text-[13px] opacity-30 w-8">${String(place).padStart(2,'0')}</div><div class="flex-1 min-w-0"><p class="font-bold text-[13px] truncate">${p.title}</p><p class="text-[11px] opacity-40 truncate">${p.team||''}</p></div><div class="text-[11px] font-mono font-bold">${p.votes}</div><div class="w-16 h-1 bg-brownDeep/10 rounded-full overflow-hidden"><div class="h-full bg-brownDeep/30" style="width:${pct}%"></div></div></div>`;
      });
      html+=`</div></div>`;
    }
    section.innerHTML=html;
    container.appendChild(section);
  });
}
async function init(){
  initClient();
  await loadActiveEvent();
  await loadData();
  if(activeEvent){
    supabaseClient.channel('votes-results').on('postgres_changes', {event:'INSERT', schema:'public', table:'votes', filter:`event_id=eq.${activeEvent.id}`}, ()=>{ loadData(); if(votes.length%3===0) launchConfetti(); }).subscribe();
  }
  setInterval(loadData, 10000);
}
document.getElementById('btnCelebrate').addEventListener('click', launchConfetti);
document.getElementById('btnFullscreen').addEventListener('click', ()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); });
window.addEventListener('load', init);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resultados - Feria San Martín - Celebración</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
window.SUPABASE_URL = window.SUPABASE_URL || "https://pgnlafozaukhdqlxfcfk.supabase.co";
window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "sb_publishable_pVJiDol9813vN_wCbuRT0w_w1vDatSz";
</script>
<script src="config.js?v=8"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',sans-serif}
.podium-gold{background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); box-shadow: 0 0 40px rgba(251,191,36,0.5);}
.podium-silver{background: linear-gradient(135deg, #e5e7eb 0%, #9ca3af 100%);}
.podium-bronze{background: linear-gradient(135deg, #fdba74 0%, #ea580c 100%);}
.celebrate{animation: celebrate 2s ease-in-out infinite;}
@keyframes celebrate{0%,100%{transform: scale(1)}50%{transform: scale(1.05)}}
.confetti-bg{position: fixed; inset:0; pointer-events:none; z-index:0;}
</style>
</head>
<body class="min-h-screen bg-[#020617] text-white relative overflow-x-hidden">
<div class="confetti-bg" id="confettiBg"></div>
<div class="fixed inset-0 bg-[radial-gradient(circle_at_20%_20%,rgba(251,191,36,0.15),transparent_40%),radial-gradient(circle_at_80%_80%,rgba(168,85,247,0.15),transparent_40%),radial-gradient(circle_at_50%_50%,rgba(56,189,248,0.08),transparent_50%)]"></div>
<main class="relative z-10 max-w-7xl mx-auto p-6 md:p-10">
<header class="flex flex-wrap justify-between items-center gap-4">
<div>
<h1 class="text-4xl md:text-6xl font-black tracking-tight">🏆 Resultados</h1>
<p id="eventName" class="text-violet-300 font-bold mt-2 text-lg">Cargando evento...</p>
<p id="liveStats" class="text-xs text-white/50 mt-1 font-mono">Conectando...</p>
</div>
<div class="flex gap-2">
<button id="btnCelebrate" class="bg-amber-400 text-black px-5 py-2.5 rounded-full font-black text-sm celebrate">🎉 Celebrar</button>
<button id="btnFullscreen" class="bg-white/10 px-4 py-2.5 rounded-full text-xs">⛶ Pantalla completa</button>
<a href="admin.html" class="bg-white/10 px-4 py-2.5 rounded-full text-xs">⚙️ Admin</a>
</div>
</header>
<div id="overallPodium" class="mt-10 grid gap-6"></div>
<div id="resultsContainer" class="mt-12 grid gap-12"></div>
<div class="mt-16 text-center text-white/20 text-xs">
<p>Actualización en tiempo real • Votos: <span id="totalVotes">0</span> • Ingresados: <span id="totalIngresados">0</span></p>
<p class="mt-2">Presiona 🎉 para lanzar confetti • Auto-actualiza cada 10s</p>
</div>
</main>
<script>
let supabaseClient=null;
let activeEvent=null;
let categories=[], projects=[], votes=[];
function initClient(){
  supabaseClient = window.initSupabaseClient ? window.initSupabaseClient() : window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
  return supabaseClient;
}
function launchConfetti(){
  const duration = 3000;
  const end = Date.now() + duration;
  (function frame(){
    confetti({particleCount: 5, angle: 60, spread: 55, origin: {x:0}, colors: ['#fbbf24','#a78bfa','#38bdf8']});
    confetti({particleCount: 5, angle: 120, spread: 55, origin: {x:1}, colors: ['#fbbf24','#a78bfa','#38bdf8']});
    if(Date.now() < end) requestAnimationFrame(frame);
  }());
  // Centro
  confetti({particleCount: 150, spread: 100, origin: {y:0.6}, colors: ['#fbbf24','#f59e0b','#a78bfa']});
}
async function loadActiveEvent(){
  try{
    let eventId = new URLSearchParams(window.location.search).get('event');
    let query = supabaseClient.from('events').select('*');
    if(eventId){
      query = query.eq('id', eventId).single();
    } else {
      query = query.eq('activo', true).order('created_at',{ascending:false}).limit(1).single();
    }
    const {data, error} = await query;
    if(error) throw error;
    activeEvent=data;
    document.getElementById('eventName').textContent=data.nombre;
    return data;
  }catch(err){
    document.getElementById('eventName').textContent='Error: '+err.message;
    return null;
  }
}
async function loadData(){
  if(!activeEvent) return;
  
  const [{data: cats}, {data: projs}, {data: vs}, {data: regs}] = await Promise.all([
    supabaseClient.from('categories').select('*').eq('event_id', activeEvent.id).order('orden'),
    supabaseClient.from('projects').select('*').eq('event_id', activeEvent.id).order('orden'),
    supabaseClient.from('votes').select('project_id, category_id').eq('event_id', activeEvent.id),
    supabaseClient.from('registrations').select('estado').eq('event_id', activeEvent.id)
  ]);
  
  categories=cats||[];
  projects=projs||[];
  votes=vs||[];
  
  const totalVotes = votes.length;
  const ingresados = regs?.filter(r=>r.estado==='INGRESADO').length||0;
  
  document.getElementById('totalVotes').textContent=totalVotes;
  document.getElementById('totalIngresados').textContent=ingresados;
  document.getElementById('liveStats').textContent=`En vivo • ${totalVotes} votos • ${ingresados} ingresados • Actualizado ${new Date().toLocaleTimeString()}`;
  
  renderResults();
}
function renderResults(){
  const container=document.getElementById('resultsContainer');
  container.innerHTML='';
  
  // Agrupar votos por proyecto
  const votesByProject={};
  votes.forEach(v=>{ votesByProject[v.project_id]=(votesByProject[v.project_id]||0)+1; });
  
  categories.forEach(cat=>{
    const projsInCat = projects.filter(p=>p.category_id===cat.id);
    const results = projsInCat.map(p=>({...p, votes: votesByProject[p.id]||0})).sort((a,b)=>b.votes-a.votes);
    const totalInCat = results.reduce((s,p)=>s+p.votes,0);
    
    const section=document.createElement('section');
    section.className='bg-white/[0.04] border border-white/10 rounded-[32px] p-6 md:p-8 backdrop-blur-xl';
    
    // Título de categoría destacado
    let html = `
      <div class="flex flex-wrap justify-between items-center gap-4">
        <div>
          <h2 class="text-3xl md:text-4xl font-black text-amber-300">📚 ${cat.label}</h2>
          <p class="text-sm text-white/40 mt-2">${cat.key} • ${results.length} proyectos • ${totalInCat} votos en esta categoría</p>
        </div>
        <div class="bg-white/10 px-4 py-2 rounded-full text-xs">${cat.votacion_abierta?'<span class="text-emerald-300">● ABIERTA</span>':'○ CERRADA'}</div>
      </div>
    `;
    
    if(results.length===0){
      html+=`<p class="mt-8 text-white/30 text-center">No hay proyectos en esta categoría</p>`;
      section.innerHTML=html;
      container.appendChild(section);
      return;
    }
    
    // Podio para top 3
    if(results.length>=1){
      html+=`<div class="mt-8 grid md:grid-cols-3 gap-4 items-end">`;
      
      // 2do lugar
      if(results[1]){
        const p=results[1];
        const percent = totalInCat?Math.round(p.votes/totalInCat*100):0;
        html+=`
          <div class="order-2 md:order-1 bg-white/[0.03] border border-white/10 rounded-[24px] p-5 text-center">
            <div class="w-16 h-16 mx-auto rounded-full podium-silver flex items-center justify-center text-2xl font-black text-black">2</div>
            <p class="mt-3 text-[11px] font-bold tracking-widest text-slate-300">🥈 SEGUNDO LUGAR</p>
            <h3 class="mt-2 font-black text-lg">${p.title}</h3>
            <p class="text-xs text-white/50">${p.team||''}</p>
            ${p.photo_url?`<img src="${p.photo_url}" class="mt-3 w-full h-[120px] object-cover rounded-xl mx-auto">`:''}
            <div class="mt-4 bg-white/10 rounded-full h-2"><div class="bg-slate-300 h-2 rounded-full" style="width:${percent}%"></div></div>
            <p class="mt-2 font-mono text-sm font-bold">${p.votes} votos • ${percent}%</p>
          </div>
        `;
      }
      
      // 1er lugar - destacado grande
      const p1=results[0];
      const percent1 = totalInCat?Math.round(p1.votes/totalInCat*100):0;
      html+=`
        <div class="order-1 md:order-2 bg-gradient-to-br from-amber-500/20 to-yellow-500/10 border-2 border-amber-400/50 rounded-[24px] p-6 text-center celebrate relative overflow-hidden">
          <div class="absolute -top-6 -right-6 text-6xl opacity-20">👑</div>
          <div class="w-20 h-20 mx-auto rounded-full podium-gold flex items-center justify-center text-3xl font-black text-black">1</div>
          <p class="mt-3 text-[11px] font-black tracking-widest text-amber-300">🥇 PRIMER LUGAR • CAMPEÓN</p>
          <h3 class="mt-2 font-black text-2xl text-amber-100">${p1.title}</h3>
          <p class="text-sm text-amber-200/70">${p1.team||''}</p>
          ${p1.photo_url?`<img src="${p1.photo_url}" class="mt-4 w-full h-[180px] object-cover rounded-xl mx-auto border-2 border-amber-400/30">`:''}
          <div class="mt-4 bg-black/30 rounded-full h-3"><div class="bg-gradient-to-r from-amber-400 to-yellow-400 h-3 rounded-full" style="width:${percent1}%"></div></div>
          <p class="mt-3 font-mono text-lg font-black text-amber-300">${p1.votes} votos • ${percent1}%</p>
          <div class="mt-3 inline-flex bg-amber-400 text-black px-3 py-1 rounded-full text-[10px] font-black">GANADOR</div>
        </div>
      `;
      
      // 3er lugar
      if(results[2]){
        const p=results[2];
        const percent = totalInCat?Math.round(p.votes/totalInCat*100):0;
        html+=`
          <div class="order-3 bg-white/[0.03] border border-orange-400/20 rounded-[24px] p-5 text-center">
            <div class="w-14 h-14 mx-auto rounded-full podium-bronze flex items-center justify-center text-xl font-black text-white">3</div>
            <p class="mt-3 text-[11px] font-bold tracking-widest text-orange-300">🥉 TERCER LUGAR</p>
            <h3 class="mt-2 font-bold">${p.title}</h3>
            <p class="text-xs text-white/50">${p.team||''}</p>
            ${p.photo_url?`<img src="${p.photo_url}" class="mt-3 w-full h-[100px] object-cover rounded-xl mx-auto">`:''}
            <div class="mt-3 bg-white/10 rounded-full h-2"><div class="bg-orange-400 h-2 rounded-full" style="width:${percent}%"></div></div>
            <p class="mt-2 font-mono text-xs">${p.votes} votos • ${percent}%</p>
          </div>
        `;
      }
      
      html+=`</div>`;
    }
    
    // Resto de puestos 4 en adelante
    if(results.length>3){
      html+=`<div class="mt-8"><h4 class="text-xs font-bold tracking-widest text-white/40">OTROS PUESTOS</h4><div class="mt-3 grid gap-2">`;
      results.slice(3).forEach((p, idx)=>{
        const place = idx+4;
        const percent = totalInCat?Math.round(p.votes/totalInCat*100):0;
        html+=`
          <div class="flex items-center gap-3 p-3 rounded-xl bg-white/[0.02] border border-white/5">
            <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-xs font-bold">${place}°</div>
            <div class="flex-1">
              <p class="font-bold text-sm">${p.title}</p>
              <p class="text-[11px] text-white/40">${p.team||''} • ${p.votes} votos (${percent}%)</p>
            </div>
            <div class="w-20 bg-white/10 rounded-full h-1.5"><div class="bg-white/30 h-1.5 rounded-full" style="width:${percent}%"></div></div>
          </div>
        `;
      });
      html+=`</div></div>`;
    }
    
    section.innerHTML=html;
    container.appendChild(section);
  });
  
  // Si hay ganador general, lanzar confetti suave
  if(votes.length>0 && votes.length % 5 === 0){
    // Cada 5 votos celebra un poco
    launchConfetti();
  }
}
async function init(){
  initClient();
  await loadActiveEvent();
  await loadData();
  
  // Realtime votos
  if(activeEvent){
    supabaseClient.channel('votes-results')
      .on('postgres_changes', {event:'INSERT', schema:'public', table:'votes', filter:`event_id=eq.${activeEvent.id}`}, ()=>{
        loadData();
        launchConfetti();
      })
      .subscribe();
  }
  
  // Auto refresh cada 10s
  setInterval(loadData, 10000);
}
document.getElementById('btnCelebrate').addEventListener('click', launchConfetti);
document.getElementById('btnFullscreen').addEventListener('click', ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});
window.addEventListener('load', init);
</script>
</body>
</html>

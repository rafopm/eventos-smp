<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Resultados - Feria San Martín</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: { colors: { cream:'#fffeea', cream2:'#fff9c5', yellow:'#ffe846', amber:'#ffba08', brownDeep:'#482000', pink:'#fe1954' } } } }</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=11"></script>
<link rel="stylesheet" href="styles.css?v=11">
</head>
<body class="min-h-screen bg-cream text-brownDeep p-6">
<header class="max-w-6xl mx-auto flex justify-between items-center mb-8">
  <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-[12px] bg-brownDeep text-cream flex items-center justify-center font-black">🏆</div><h1 class="font-display font-black text-2xl">Resultados en vivo</h1></div>
  <div id="eventTag" class="badge badge-cream">Cargando...</div>
</header>
<main class="max-w-6xl mx-auto space-y-6">
  <div id="stats" class="grid md:grid-cols-3 gap-3"></div>
  <div id="resultsByCategory" class="grid gap-6"></div>
</main>
<script>
let supabaseClient=null, activeEvent=null;
function initClient(){ supabaseClient = window.initSupabaseClient ? window.initSupabaseClient() : window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY); return supabaseClient; }
async function loadActiveEvent(){
  const urlParams=new URLSearchParams(window.location.search); const eventParam=urlParams.get('event');
  let query=supabaseClient.from('events').select('*');
  if(eventParam) query=query.eq('id', eventParam);
  else query=query.eq('activo', true);
  const {data} = await query.limit(1).single(); activeEvent=data; document.getElementById('eventTag').textContent=data?.nombre||'Sin evento'; return data;
}
async function loadResults(){
  const container=document.getElementById('resultsByCategory'); container.innerHTML='<p class="opacity-40">Cargando...</p>';
  const {data: cats} = await supabaseClient.from('categories').select('*').eq('event_id', activeEvent.id).order('orden');
  const {data: projs} = await supabaseClient.from('projects').select('*').eq('event_id', activeEvent.id).eq('activo', true);
  const {data: votes} = await supabaseClient.from('votes').select('project_id').eq('event_id', activeEvent.id);
  const votesByProject={}; votes?.forEach(v=>{ votesByProject[v.project_id]=(votesByProject[v.project_id]||0)+1; });
  const totalVotes=votes?.length||0;
  document.getElementById('stats').innerHTML=`<div class="card p-4"><p class="text-[11px] font-bold opacity-50">TOTAL VOTOS</p><p class="text-2xl font-black">${totalVotes}</p></div><div class="card p-4"><p class="text-[11px] font-bold opacity-50">PROYECTOS ACTIVOS</p><p class="text-2xl font-black">${projs.length}</p></div><div class="card p-4"><p class="text-[11px] font-bold opacity-50">CATEGORÍAS</p><p class="text-2xl font-black">${cats.length}</p></div>`;
  container.innerHTML='';
  cats.forEach(cat=>{
    const projectsInCat = projs.filter(p=>p.category_id===cat.id);
    const results = projectsInCat.map(p=>({...p, votes: votesByProject[p.id]||0})).sort((a,b)=>b.votes-a.votes);
    const totalInCat = results.reduce((s,p)=>s+p.votes,0);
    const section=document.createElement('div'); section.className='card p-6';
    let html=`<div class="flex justify-between items-start"><div><h3 class="font-display font-black text-xl">${cat.label}</h3><p class="text-xs opacity-60">${totalInCat} votos</p></div><span class="badge ${cat.votacion_abierta?'badge-green':'badge-cream'}">${cat.votacion_abierta?'Abierta':'Cerrada'}</span></div><div class="mt-5 grid gap-3">`;
    if(results.length===0) html+=`<p class="text-sm opacity-40">Sin proyectos activos</p>`;
    else results.forEach((proj, idx)=>{
      const place=idx+1; const badge=place===1?'🥇':place===2?'🥈':place===3?'🥉':`${place}°`; const percent=totalInCat? Math.round(proj.votes/totalInCat*100):0;
      html+=`<div class="flex gap-4 p-4 rounded-[16px] ${place===1?'bg-amber/20 border border-amber': place<=3?'bg-cream2 border border-brownDeep/5':'bg-white border border-brownDeep/5'}"><div class="text-center min-w-[60px]"><div class="font-black">${badge}</div><div class="text-xs font-mono">${proj.votes} votos</div><div class="text-[10px] opacity-50">${percent}%</div></div><div class="flex-1"><p class="font-bold">${proj.title}</p><p class="text-xs opacity-60">${proj.nombre_grupo||''} ${proj.team? '• '+proj.team:''}</p><div class="mt-2 progress"><div class="progress-bar" style="width:${percent}%"></div></div></div>${proj.photo_url?`<img src="${proj.photo_url}" class="w-20 h-20 rounded-[12px] object-cover">`:''}</div>`;
    });
    html+=`</div>`; section.innerHTML=html; container.appendChild(section);
  });
}
window.addEventListener('load', async()=>{ initClient(); await loadActiveEvent(); if(activeEvent) await loadResults(); setInterval(()=>{ if(activeEvent) loadResults(); }, 5000); });
</script>
</body>
</html>

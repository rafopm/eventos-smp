<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Votación - Mejorado</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script>
window.SUPABASE_URL = window.SUPABASE_URL || "https://pgnlafozaukhdqlxfcfk.supabase.co";
window.SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "sb_publishable_pVJiDol9813vN_wCbuRT0w_w1vDatSz";
</script>
<script src="config.js?v=10"></script>
</head>
<body class="min-h-screen bg-[#071114] text-white p-4">
<main class="mx-auto max-w-3xl">
<header class="border-b border-white/10 pb-5">
<div class="flex justify-between items-center">
<h1 class="text-3xl font-extrabold">Votación de proyectos</h1>
<div id="eventTag" class="bg-white/10 px-3 py-1.5 rounded-full text-xs">Conectando...</div>
</div>
<p id="identityLabel" class="text-white/55 text-sm mt-2">Verificando evento...</p>
<p id="status" class="text-[11px] font-mono text-white/30 mt-1"></p>
</header>
<section id="loginPanel" class="mt-6">
<form id="loginForm" class="grid gap-4 max-w-lg bg-white/[0.04] border border-white/10 p-5 rounded-2xl">
<p class="text-xs text-white/50">Ingresa con el mismo correo y DNI con el que te registraste y pasaste por scanner</p>
<input id="emailInput" type="email" required placeholder="tu@correo.com (el registrado)" class="rounded-xl bg-white/[0.06] border border-white/15 px-4 py-3 text-sm">
<input id="dniInput" required pattern="[0-9]{8}" maxlength="8" placeholder="DNI 8 dígitos" class="rounded-xl bg-white/[0.06] border border-white/15 px-4 py-3 text-sm">
<button id="btnLogin" class="bg-teal-300 text-black font-extrabold py-3 rounded-xl">Continuar</button>
<p id="loginMessage" class="hidden p-3 rounded-xl text-sm"></p>
</form>
</section>
<section id="votePanel" class="hidden mt-6">
<div id="attendanceMessage" class="p-4 rounded-xl bg-teal-300/10 border border-teal-300/20 text-sm"></div>
<div id="summary" class="mt-4 p-3 rounded-xl bg-white/[0.04] border border-white/10 text-xs text-white/50"></div>
<div id="gradeList" class="mt-6 grid gap-8"></div>
<button id="btnLogout" class="mt-8 text-xs bg-white/10 px-4 py-2 rounded-full">Cambiar usuario</button>
</section>
</main>
<script>
let supabaseClient=null;
let voter=null, activeEvent=null, categories=[], myVotes={};
function log(msg){
  const el=document.getElementById('status');
  if(el) el.textContent=msg;
  console.log(msg);
}
function initClient(){
  const url = window.SUPABASE_URL;
  const key = window.SUPABASE_ANON_KEY;
  if(!window.supabase?.createClient){
    log('ERROR: CDN supabase no cargó');
    document.getElementById('eventTag').textContent='Error CDN';
    return null;
  }
  try{
    supabaseClient = window.initSupabaseClient ? window.initSupabaseClient() : window.supabase.createClient(url, key);
    window.supabaseClient = supabaseClient;
    log('Cliente OK');
    return supabaseClient;
  }catch(e){
    log('ERROR cliente: '+e.message);
    return null;
  }
}
async function loadActiveEvent(){
  if(!supabaseClient) return null;
  try{
    log('Buscando evento activo...');
    const {data, error} = await supabaseClient.from('events').select('*').eq('activo', true).limit(1).single();
    if(error){
      document.getElementById('eventTag').textContent='Sin evento';
      document.getElementById('identityLabel').textContent='No hay evento activo. Configúralo en admin.html';
      return null;
    }
    activeEvent=data;
    document.getElementById('eventTag').textContent=data.nombre;
    document.getElementById('eventTag').className='bg-lime-300 text-black px-3 py-1.5 rounded-full text-xs font-bold';
    document.getElementById('identityLabel').textContent=`Evento: ${data.nombre} - Ingresa tus datos para votar`;
    log('Evento activo: '+data.nombre);
    return data;
  }catch(err){
    log('Error loadActiveEvent: '+err.message);
    return null;
  }
}
async function authenticate(email,dni){
  const btn=document.getElementById('btnLogin');
  const msgEl=document.getElementById('loginMessage');
  btn.disabled=true; btn.textContent='Verificando...';
  msgEl.classList.add('hidden');
  
  try{
    if(!activeEvent) await loadActiveEvent();
    if(!activeEvent) throw new Error('No hay evento activo');
    
    log(`Autenticando ${email} / ${dni}...`);
    
    const {data: reg, error} = await supabaseClient.from('registrations')
      .select('*')
      .eq('event_id', activeEvent.id)
      .eq('email', email.toLowerCase())
      .eq('dni', dni)
      .single();
    
    if(error || !reg){
      msgEl.textContent='❌ No encontramos registro con ese correo y DNI. ¿Te registraste en index.html?';
      msgEl.className='p-3 rounded-xl text-sm bg-red-500/10 border border-red-500/20 text-red-200';
      msgEl.classList.remove('hidden');
      return false;
    }
    
    if(reg.estado !== 'INGRESADO'){
      msgEl.innerHTML=`⚠️ Ya estás registrado como <b>${reg.nombres}</b> pero aún no pasaste por scanner. Estado: <b>${reg.estado}</b>.`;
      msgEl.className='p-3 rounded-xl text-sm bg-amber-500/10 border border-amber-500/20 text-amber-200';
      msgEl.classList.remove('hidden');
      return false;
    }
    
    voter=reg;
    
    // MEJORA: Traer votos con JOIN a projects para mostrar por quién votó
    let votes = [];
    try{
      // Intento con JOIN (si hay FK projects)
      const {data, error: ve} = await supabaseClient.from('votes')
        .select('category_id, project_id, created_at, projects(title, team, photo_url, description)')
        .eq('registration_id', voter.id);
      if(ve) throw ve;
      votes = data || [];
    }catch(e){
      log('JOIN falló, fallback sin JOIN: '+e.message);
      const {data} = await supabaseClient.from('votes').select('category_id, project_id, created_at').eq('registration_id', voter.id);
      votes = data || [];
      // Cargar proyectos de esos votos manualmente
      if(votes.length>0){
        const projIds = votes.map(v=>v.project_id);
        const {data: projs} = await supabaseClient.from('projects').select('id, title, team, photo_url').in('id', projIds);
        const map = {};
        projs?.forEach(p=>map[p.id]=p);
        votes = votes.map(v=>({...v, projects: map[v.project_id] || null}));
      }
    }
    
    myVotes={};
    votes.forEach(v=>{
      myVotes[v.category_id]={
        project_id: v.project_id,
        project: v.projects || null,
        created_at: v.created_at
      };
    });
    
    document.getElementById('loginPanel').classList.add('hidden');
    document.getElementById('votePanel').classList.remove('hidden');
    document.getElementById('identityLabel').textContent=`✅ ${voter.nombres} ${voter.apellidos} (${voter.email})`;
    document.getElementById('attendanceMessage').innerHTML=`Bienvenido <b>${voter.nombres}</b>. Ingresaste a las ${new Date(voter.hora_ingreso).toLocaleTimeString()}. Votas 1 vez por categoría.`;
    
    await loadCategories();
    updateSummary();
    log('Autenticado OK');
    return true;
    
  }catch(err){
    msgEl.textContent='Error: '+err.message;
    msgEl.className='p-3 rounded-xl text-sm bg-red-500/10 border border-red-500/20 text-red-200';
    msgEl.classList.remove('hidden');
    log('Error auth: '+err.message);
    return false;
  } finally {
    btn.disabled=false; btn.textContent='Continuar';
  }
}
async function loadCategories(){
  try{
    const {data: cats} = await supabaseClient.from('categories').select('*').eq('event_id', activeEvent.id).order('orden');
    const {data: projs} = await supabaseClient.from('projects').select('*').eq('event_id', activeEvent.id).order('orden');
    categories = cats.map(c=>({...c, projects: projs.filter(p=>p.category_id===c.id && p.activo!==false)}));
    render();
  }catch(err){
    document.getElementById('gradeList').innerHTML=`<p class="text-red-300 text-sm">Error: ${err.message}</p>`;
  }
}
function updateSummary(){
  const total = categories.length;
  const voted = Object.keys(myVotes).length;
  document.getElementById('summary').textContent = `Has votado en ${voted} de ${total} categorías.`;
}
function render(){
  const list=document.getElementById('gradeList'); list.innerHTML='';
  if(categories.length===0){
    list.innerHTML='<p class="text-white/40 text-sm">No hay categorías. Crea en admin.html</p>';
    return;
  }
  
  categories.forEach(cat=>{
    const voteInfo = myVotes[cat.id]; // ahora es objeto con proyecto
    const sec=document.createElement('section'); sec.className='border border-white/10 rounded-2xl p-5 bg-white/[0.02]';
    
    // Header categoría
    const header = document.createElement('div');
    header.className='flex justify-between items-center';
    header.innerHTML=`<h2 class="text-xl font-extrabold">${cat.label}</h2>
      <span class="text-xs font-bold px-2.5 py-1 rounded-full ${voteInfo?'bg-emerald-400 text-black':cat.votacion_abierta?'bg-teal-300 text-black':'bg-white/10 text-white/40'}">
        ${voteInfo?'VOTASTE':'ABIERTA'}
      </span>`;
    sec.appendChild(header);
    
    if(voteInfo){
      // MEJORA: Mostrar por quién votó con foto y datos
      const votedCard = document.createElement('div');
      votedCard.className='mt-4 rounded-xl border-2 border-emerald-400/50 bg-emerald-500/10 p-4';
      
      const proj = voteInfo.project;
      const votedAt = voteInfo.created_at ? new Date(voteInfo.created_at).toLocaleString() : '';
      
      votedCard.innerHTML=`
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 rounded-full bg-emerald-400 text-black flex items-center justify-center font-black text-sm">✓</div>
          <div class="flex-1">
            <p class="text-[11px] font-bold tracking-widest text-emerald-300">TU VOTO EN ESTA CATEGORÍA</p>
            <h3 class="font-black text-lg mt-1">${proj ? proj.title : 'Proyecto ID: '+voteInfo.project_id}</h3>
            ${proj && proj.team ? `<p class="text-xs text-white/60 mt-1">Equipo: ${proj.team}</p>` : ''}
            ${votedAt ? `<p class="text-[11px] text-white/40 mt-2">Votaste el ${votedAt}</p>` : ''}
            ${proj && proj.photo_url ? `<img src="${proj.photo_url}" class="mt-3 w-full max-w-[320px] aspect-[16/9] object-cover rounded-lg border border-white/10">` : ''}
          </div>
        </div>
        <p class="mt-3 text-xs text-emerald-200/70">No puedes cambiar tu voto en esta categoría. Si necesitas corregir, habla con el admin en mesa.</p>
      `;
      sec.appendChild(votedCard);
      
    } else if(cat.votacion_abierta){
      if(cat.projects.length===0){
        sec.innerHTML+='<p class="mt-4 text-sm text-white/45">No hay proyectos aún.</p>';
      } else {
        const grid=document.createElement('div'); grid.className='mt-4 grid gap-3 sm:grid-cols-2';
        cat.projects.forEach(p=>{
          const card=document.createElement('article');
          card.className='rounded-xl border border-white/10 bg-white/[0.04] p-4 hover:bg-white/[0.06] transition cursor-pointer';
          card.innerHTML=`
            ${p.photo_url?`<img src="${p.photo_url}" class="w-full aspect-[16/9] object-cover rounded-lg mb-3">`:''}
            <h3 class="font-bold text-sm">${p.title}</h3>
            ${p.team?`<p class="text-xs text-white/55 mt-1">${p.team}</p>`:''}
            ${p.description?`<p class="text-[11px] text-white/40 mt-2 line-clamp-2">${p.description}</p>`:''}
            <button class="mt-3 w-full bg-teal-300 text-black font-bold py-2.5 rounded-lg text-sm">Votar por este</button>
          `;
          card.querySelector('button').onclick=()=>castVote(cat,p);
          grid.appendChild(card);
        });
        sec.appendChild(grid);
      }
    } else {
      sec.innerHTML+='<p class="mt-4 text-sm text-white/45">Votación cerrada por el momento.</p>';
    }
    
    list.appendChild(sec);
  });
}
async function castVote(cat, proj){
  if(!confirm(`¿Confirmas voto por "${proj.title}" en ${cat.label}? No podrás cambiarlo.`)) return;
  try{
    const {error} = await supabaseClient.from('votes').insert({
      event_id: activeEvent.id,
      category_id: cat.id,
      project_id: proj.id,
      registration_id: voter.id,
      voter_email: voter.email
    });
    if(error){
      if(error.message.includes('duplicate') || error.code==='23505'){
        alert('Ya votaste en esta categoría - recargando tu voto');
        // Recargar voto real
        const {data} = await supabaseClient.from('votes').select('category_id, project_id, created_at, projects(title, team, photo_url)').eq('registration_id', voter.id).eq('category_id', cat.id).single();
        if(data){
          myVotes[cat.id]={project_id: data.project_id, project: data.projects, created_at: data.created_at};
        } else {
          myVotes[cat.id]={project_id: proj.id, project: proj, created_at: new Date().toISOString()};
        }
        render(); updateSummary();
        return;
      }
      alert('Error: '+error.message);
      return;
    }
    // Guardar voto local con datos completos
    myVotes[cat.id]={
      project_id: proj.id,
      project: proj,
      created_at: new Date().toISOString()
    };
    render(); updateSummary();
    log(`Voto OK: ${cat.label} -> ${proj.title}`);
  }catch(err){
    alert('Error: '+err.message);
  }
}
document.getElementById('loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const email=document.getElementById('emailInput').value.trim();
  const dni=document.getElementById('dniInput').value.trim();
  await authenticate(email, dni);
});
document.getElementById('btnLogout').addEventListener('click', ()=>{
  voter=null; myVotes={};
  document.getElementById('votePanel').classList.add('hidden');
  document.getElementById('loginPanel').classList.remove('hidden');
  document.getElementById('emailInput').value='';
  document.getElementById('dniInput').value='';
  document.getElementById('loginMessage').classList.add('hidden');
});
window.addEventListener('load', async()=>{
  const client = initClient();
  if(client) await loadActiveEvent();
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if(id && supabaseClient){
    try{
      const {data: reg} = await supabaseClient.from('registrations').select('email,dni').eq('id', id).single();
      if(reg){
        document.getElementById('emailInput').value=reg.email;
        document.getElementById('dniInput').value=reg.dni;
      }
    }catch(e){}
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test Conexión Supabase</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body class="min-h-screen bg-[#0f172a] text-white p-6">
<main class="max-w-2xl mx-auto">
<h1 class="text-2xl font-black">Test Conexión Supabase</h1>
<div id="logs" class="mt-6 grid gap-3 text-sm font-mono"></div>

<div class="mt-8 bg-white/[0.05] border border-white/10 rounded-2xl p-6">
<h2 class="font-bold">Probar Login</h2>
<input id="email" placeholder="eventos@colegiosanmartin.edu.pe" class="mt-3 w-full rounded-xl bg-white/[0.06] border border-white/10 px-4 py-3">
<input id="pass" type="password" placeholder="password" class="mt-2 w-full rounded-xl bg-white/[0.06] border border-white/10 px-4 py-3">
<button id="btnLogin" class="mt-3 w-full bg-lime-300 text-black font-bold py-3 rounded-xl">Probar Login</button>
<div id="loginResult" class="mt-3 text-sm"></div>
</div>
</main>
<script>
function log(msg, type='info'){
  const div=document.createElement('div');
  div.className='p-3 rounded-xl border '+(type==='ok'?'bg-emerald-500/10 border-emerald-500/20 text-emerald-200':type==='error'?'bg-red-500/10 border-red-500/20 text-red-200':'bg-white/[0.05] border-white/10 text-white/70');
  div.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;
  document.getElementById('logs').appendChild(div);
  console.log(msg);
}

async function test(){
  log('1. Verificando que config.js cargó...');
  if(typeof SUPABASE_URL==='undefined'){ log('ERROR: SUPABASE_URL no definido - config.js no cargó o tiene API_BASE viejo de Apps Script', 'error'); return; }
  if(SUPABASE_URL.includes('script.google.com')){ log('ERROR: config.js todavía tiene la URL de Apps Script, no la de Supabase', 'error'); return; }
  if(SUPABASE_URL.includes('TU-PROYECTO')){ log('ERROR: config.js tiene placeholder TU-PROYECTO, pega tu URL real de Supabase', 'error'); return; }
  log(`URL: ${SUPABASE_URL}`, 'ok');
  
  log('2. Verificando cliente supabase...');
  if(typeof supabase==='undefined'){ log('ERROR: supabase no definido - revisa orden de scripts: primero supabase-js CDN, luego config.js', 'error'); return; }
  log('Cliente supabase OK', 'ok');

  log('3. Probando SELECT publico a events...');
  const {data, error} = await supabase.from('events').select('*').limit(1);
  if(error){ log(`ERROR SELECT events: ${error.message} | ${JSON.stringify(error)}`, 'error'); }
  else{ log(`SELECT OK - encontró ${data.length} eventos`, 'ok'); }

  log('4. Verificando Auth...');
  const {data: {session}} = await supabase.auth.getSession();
  if(session){ log(`Sesión activa: ${session.user.email}`, 'ok'); }
  else{ log('Sin sesión - necesitas loguearte', 'info'); }
}

document.getElementById('btnLogin').addEventListener('click', async()=>{
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  const resDiv=document.getElementById('loginResult');
  resDiv.textContent='Intentando login...';
  const {data, error} = await supabase.auth.signInWithPassword({email, password: pass});
  if(error){ resDiv.textContent=`ERROR LOGIN: ${error.message}`; log(`Login falló: ${error.message}`, 'error'); }
  else{ resDiv.textContent=`Login OK: ${data.user.email} - session: ${data.session.access_token.slice(0,20)}...`; log(`Login OK como ${data.user.email}`, 'ok'); }
});

window.addEventListener('load', test);
</script>
</body>
</html>

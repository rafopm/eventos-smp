<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test Conexión v3 - Hardcodeado</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script>
// HARDCODEADO - no usa config.js para aislar el problema
window.SUPABASE_URL = "https://pgnlafozaukhdqlxfcfk.supabase.co";
window.SUPABASE_ANON_KEY = "sb_publishable_pVJiDol9813vN_wCbuRT0w_w1vDatSz";
</script>
</head>
<body class="min-h-screen bg-[#0f172a] text-white p-6">
<main class="max-w-2xl mx-auto">
<h1 class="text-2xl font-black">Test v3 - Hardcodeado (sin config.js)</h1>
<p class="text-white/50 text-sm">Si este funciona, el problema era el cache de config.js</p>
<div id="logs" class="mt-6 grid gap-3 text-sm font-mono"></div>

<div class="mt-8 bg-white/[0.05] border border-white/10 rounded-2xl p-6">
<h2 class="font-bold">Login</h2>
<input id="email" value="eventos@colegiosanmartin.edu.pe" class="mt-3 w-full rounded-xl bg-white/[0.06] border border-white/10 px-4 py-3">
<input id="pass" type="password" placeholder="password" class="mt-2 w-full rounded-xl bg-white/[0.06] border border-white/10 px-4 py-3">
<button id="btnLogin" class="mt-3 w-full bg-lime-300 text-black font-bold py-3 rounded-xl">Probar Login</button>
<div id="loginResult" class="mt-3 text-sm"></div>
</div>
</main>
<script>
function log(msg, type='info'){
  const div=document.createElement('div');
  div.className='p-3 rounded-xl border '+(type==='ok'?'bg-emerald-500/10 border-emerald-500/20 text-emerald-200':type==='error'?'bg-red-500/10 border-red-500/20 text-red-200':'bg-white/[0.05] border-white/10 text-white/70');
  div.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;
  document.getElementById('logs').appendChild(div);
  console.log(msg);
}

let supabaseClient = null;

async function test(){
  log(`URL hardcodeada: ${window.SUPABASE_URL}`, 'ok');
  log(`KEY: ${window.SUPABASE_ANON_KEY.slice(0,25)}...`, 'ok');
  
  if(!window.supabase || !window.supabase.createClient){
    log('ERROR: window.supabase.createClient no existe - CDN no cargó', 'error');
    log(`window.supabase = ${typeof window.supabase}`, 'error');
    return;
  }
  log('Librería supabase UMD OK', 'ok');
  
  try{
    supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    window.supabaseClient = supabaseClient;
    log('Cliente creado con sb_publishable_... OK', 'ok');
  }catch(e){
    log(`ERROR creando cliente: ${e.message}`, 'error');
    return;
  }
  
  try{
    const {data, error} = await supabaseClient.from('events').select('*').limit(1);
    if(error){ log(`SELECT events ERROR: ${error.message} | code: ${error.code}`, 'error'); }
    else{ log(`SELECT events OK: ${data.length} filas - CONEXIÓN FUNCIONA!`, 'ok'); }
  }catch(e){
    log(`Excepción SELECT: ${e.message}`, 'error');
  }
}

document.getElementById('btnLogin').addEventListener('click', async()=>{
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  const resDiv=document.getElementById('loginResult');
  if(!supabaseClient){ resDiv.textContent='Cliente no creado'; return; }
  resDiv.textContent='Logueando...';
  const {data, error} = await supabaseClient.auth.signInWithPassword({email, password: pass});
  if(error){ resDiv.textContent=`ERROR: ${error.message}`; log(`Login ERROR: ${error.message}`, 'error'); }
  else{ resDiv.textContent=`OK: ${data.user.email}`; log(`Login OK: ${data.user.email}`, 'ok'); }
});

window.addEventListener('load', test);
</script>
</body>
</html>
